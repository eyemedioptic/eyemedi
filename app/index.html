<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#12343a">

<title>Phần mềm bán hàng | EYEMEDI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: cột điều hướng trái + vùng làm việc; trên điện thoại điều hướng thành thanh dưới. */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --surface-2:#eef2f3; --line:#dde3e6;
  --fg:#17242b; --muted:#5f6f77; --accent:#0d6e74; --accent-fg:#ffffff; --accent-soft:#d9eeee;
  --nav:#12343a; --nav-fg:#cfe3e4; --nav-active:#ffffff;
  --good:#1f7a43; --good-soft:#dcf1e3; --warn:#9a5b00; --warn-soft:#fbecd2; --bad:#b42318; --bad-soft:#fbe0dd;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1719; --surface:#162226; --surface-2:#1c2b30; --line:#2a3b41;
  --fg:#e4ecee; --muted:#93a6ad; --accent:#3fb7bd; --accent-fg:#06272a; --accent-soft:#173c40;
  --nav:#0a1214; --nav-fg:#9fb7bb; --nav-active:#ffffff;
  --good:#5cc98a; --good-soft:#163524; --warn:#e8ac4a; --warn-soft:#3a2a10; --bad:#f07a6e; --bad-soft:#3d1a17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1719; --surface:#162226; --surface-2:#1c2b30; --line:#2a3b41;
  --fg:#e4ecee; --muted:#93a6ad; --accent:#3fb7bd; --accent-fg:#06272a; --accent-soft:#173c40;
  --nav:#0a1214; --nav-fg:#9fb7bb; --nav-active:#ffffff;
  --good:#5cc98a; --good-soft:#163524; --warn:#e8ac4a; --warn-soft:#3a2a10; --bad:#f07a6e; --bad-soft:#3d1a17; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:216px 1fr;min-height:100%}
nav.side{background:var(--nav);color:var(--nav-fg);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;color:var(--nav-active)}
.brand svg{flex:none}
.brand b{font-size:17px;letter-spacing:.2px}
.brand small{display:block;font-size:11px;color:var(--nav-fg);font-weight:400}
nav.side a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;color:inherit;text-decoration:none;font-weight:500}
nav.side a:hover{background:rgba(255,255,255,.06)}
nav.side a.on{background:rgba(255,255,255,.12);color:var(--nav-active)}
nav.side a svg{width:18px;height:18px;flex:none}
nav.side .spacer{flex:1}
nav.side .foot{font-size:11px;padding:8px 10px;opacity:.8}
main{min-width:0;padding-block:20px 40px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1{font-size:22px;margin:0;text-wrap:balance}
h2{font-size:16px;margin:0 0 10px}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head .grow{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;background:var(--surface-2)}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neu{background:var(--surface-2);color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:99px;cursor:pointer;font-size:13px}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);color:var(--warn);padding:10px 14px;border-radius:var(--r);margin-bottom:16px;font-weight:500}
.banner .grow{flex:1;min-width:200px}
/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;text-align:left}
.pcard:hover{border-color:var(--accent)}
.pcard .nm{font-weight:600;line-height:1.3}
.pcard .pr{font-weight:700;color:var(--accent);margin-top:auto}
.pcard .meta{font-size:12px;color:var(--muted)}
.cart{position:sticky;top:16px;display:flex;flex-direction:column;gap:12px}
.cline{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.cline .nm{font-weight:600}
main a:not(.btn){color:var(--accent)}
.qty{justify-self:start;display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px}
.qty button{border:0;background:none;width:28px;height:28px;cursor:pointer;font-size:16px}
.qty input{width:44px;border:0;text-align:center;padding:4px;box-shadow:none}
.sumrow{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.sumrow.total{font-size:20px;font-weight:700;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);padding:8px 4px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500}
.seg button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
.sugg{border:1px solid var(--line);border-radius:6px;margin-top:4px;max-height:180px;overflow:auto;background:var(--surface)}
.sugg div{padding:8px 10px;cursor:pointer}
.sugg div:hover{background:var(--surface-2)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.stat .lb{font-size:12px;color:var(--muted);font-weight:500}
.stat .v{font-size:22px;font-weight:700;margin-top:4px}
.stat .d{font-size:12px;margin-top:2px}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.chart svg{width:100%;height:auto;display:block}
.bar-list{display:flex;flex-direction:column;gap:10px}
.bar-list .row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px}
.bar-list .track{grid-column:1/-1;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar-list .fill{height:100%;background:var(--accent)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(8,20,24,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
.modal{background:var(--surface);border-radius:10px;width:100%;max-width:560px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{max-width:760px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.rx{width:100%;border-collapse:collapse}
.rx th,.rx td{border:1px solid var(--line);padding:4px;text-align:center}
.rx td input{border:0;text-align:center;padding:4px;box-shadow:none}
.rx th{background:var(--surface-2);font-size:11px}
.receipt{font-size:13px;border:1px dashed var(--line);padding:16px;border-radius:6px;background:var(--surface-2)}
.receipt .c{text-align:center}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));right:max(20px,env(safe-area-inset-right,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:6px;z-index:60;font-weight:500}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent;font-weight:500;color:var(--muted);white-space:nowrap}
.tabs button.on{border-color:var(--accent);color:var(--fg)}
.kbd{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted)}
@media (max-width:1100px){.pos{grid-template-columns:minmax(0,1fr) 330px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  nav.side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));z-index:40;overflow-x:auto;gap:2px}
  .brand,nav.side .spacer,nav.side .foot{display:none}
  nav.side a{flex-direction:column;gap:2px;font-size:10px;padding:6px 8px;flex:1;min-width:58px}
  main{padding-bottom:90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .pos{grid-template-columns:minmax(0,1fr)}
  .cart{position:static}
  .grid3,.grid4{grid-template-columns:1fr 1fr}
}
@media (max-width:480px){.grid2,.grid3,.grid4{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stat .v{font-size:18px}.pgrid{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>

<div class="app">

    <div class="brand">

<script>
/* ============ Dữ liệu ============ */
const KEY='eyemedi-pos-v1';
const CATS=['Gọng kính','Tròng kính','Kính râm','Kính áp tròng','Phụ kiện','Dịch vụ'];
const METHODS={cash:'Tiền mặt',bank:'Chuyển khoản',card:'Quẹt thẻ',cod:'Thu hộ (COD)'};
const CHANNELS={pos:'Tại quầy',facebook:'Facebook',zalo:'Zalo',chatbot:'Chatbot',ctv:'Cộng tác viên',web:'Website'};
const STATUS={pending:['Chờ xác nhận','warn'],shipping:['Đang giao','neu'],done:['Hoàn thành','good'],cancelled:['Đã hủy','bad']};
const statusPill=s=>`<span class="pill ${STATUS[s][1]}">${STATUS[s][0]}</span>`;
let S;
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const money=n=>(Math.round(n||0)).toLocaleString('vi-VN')+'₫';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=t=>{const d=new Date(t);return d.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'})};
const fmtDT=t=>{const d=new Date(t);return d.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})};
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const startOfDay=(t=Date.now())=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const parseNum=v=>{const n=Number(String(v).replace(/[^\d-]/g,''));return isNaN(n)?0:n};
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');

function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const r=localStorage.getItem(KEY);if(r){S=JSON.parse(r)}}catch(e){}if(!S)S=seed();migrate()}
function migrate(){
  S.ctvs=S.ctvs||[];
  S.orders.forEach(o=>{o.channel=o.channel||'pos';o.shipFee=o.shipFee||0});
  if(S.sample&&!S.ctvs.length){
    S.ctvs.push({id:uid(),name:'Đỗ Thị Mai (CTV)',phone:'0935111222',rate:10,sample:true},{id:uid(),name:'Vũ Đức Long (CTV)',phone:'0906333444',rate:8,sample:true});
    // gán kênh cho một phần đơn mẫu để báo cáo có số liệu
    S.orders.forEach((o,i)=>{if(o.sample&&o.channel==='pos'&&!o._ch){o._ch=1;const k=i%5;if(k===1)o.channel='facebook';else if(k===2)o.channel='zalo';else if(k===3){o.channel='ctv';o.ctvId=S.ctvs[i%2].id;o.commission=Math.round(o.total*S.ctvs[i%2].rate/100)}}});
    const p=S.products[8],c=S.customers[3];
    if(p&&c&&p.stock>0){p.stock--;S.orders.push({id:uid(),code:'DH'+(++S.seq),date:Date.now()-3600000,customerId:c.id,items:[{pid:p.id,name:p.name,sku:p.sku,price:p.price,cost:p.cost,qty:1}],subtotal:p.price,discount:0,shipFee:30000,total:p.price+30000,method:'cod',paid:0,status:'pending',channel:'facebook',address:'12 Nguyễn Trãi, P. Bến Thành, Q.1, TP.HCM',note:'Khách nhắn qua Fanpage',sample:true})}
  }
}

function seed(){
  const P=(sku,name,cat,brand,price,cost,stock)=>({id:uid(),sku,name,cat,brand,price,cost,stock,barcode:'',sample:true});
  const products=[
    P('GK-TI-001','Gọng titan mảnh 52-18','Gọng kính','Eyemedi',1250000,520000,14),
    P('GK-AC-002','Gọng acetate vuông nâu','Gọng kính','Eyemedi',890000,360000,9),
    P('GK-TR-003','Gọng nhựa dẻo TR90 trẻ em','Gọng kính','KidsView',650000,240000,3),
    P('GK-KL-004','Gọng kim loại tròn vintage','Gọng kính','Eyemedi',990000,410000,6),
    P('TK-156-AS','Tròng 1.56 chống ánh sáng xanh (cặp)','Tròng kính','Chemi',550000,190000,40),
    P('TK-160-UV','Tròng 1.60 siêu mỏng UV400 (cặp)','Tròng kính','Essilor',1450000,720000,22),
    P('TK-167-PG','Tròng đa tròng 1.67 (cặp)','Tròng kính','Hoya',4200000,2300000,5),
    P('TK-156-PC','Tròng đổi màu 1.56 (cặp)','Tròng kính','Chemi',980000,420000,12),
    P('KR-POL-01','Kính râm phân cực mắt mèo','Kính râm','SunLine',1150000,470000,7),
    P('KR-AV-02','Kính râm phi công gọng vàng','Kính râm','SunLine',1350000,560000,2),
    P('AT-1D-30','Lens 1 ngày hộp 30 miếng','Kính áp tròng','ClearDay',420000,250000,25),
    P('AT-1M-02','Lens 1 tháng (cặp)','Kính áp tròng','ClearDay',280000,150000,18),
    P('PK-NR-120','Nước ngâm lens 120ml','Phụ kiện','ClearDay',95000,45000,30),
    P('PK-HOP-01','Hộp đựng kính da','Phụ kiện','Eyemedi',120000,40000,50),
    P('PK-KHAN-01','Khăn lau kính microfiber','Phụ kiện','Eyemedi',30000,8000,120),
    P('DV-DO-MAT','Đo khúc xạ mắt','Dịch vụ','Eyemedi',0,0,null),
    P('DV-CAT-KINH','Cắt lắp tròng theo đơn','Dịch vụ','Eyemedi',50000,0,null),
  ];
  products.forEach(p=>{if(p.cat==='Dịch vụ')p.service=true});
  const C=(name,phone,rx)=>({id:uid(),name,phone,note:'',rx,createdAt:Date.now()-86400000*30,sample:true});
  const customers=[
    C('Nguyễn Thu Hà','0912345678',{od:{sph:'-2.25',cyl:'-0.50',ax:'180',add:''},os:{sph:'-2.00',cyl:'-0.75',ax:'170',add:''},pd:'62'}),
    C('Trần Minh Quân','0988123456',{od:{sph:'-4.50',cyl:'',ax:'',add:''},os:{sph:'-4.25',cyl:'-0.25',ax:'90',add:''},pd:'64'}),
    C('Lê Hoàng Anh','0903456789',{od:{sph:'+1.25',cyl:'',ax:'',add:'+2.00'},os:{sph:'+1.50',cyl:'',ax:'',add:'+2.00'},pd:'63'}),
    C('Phạm Bảo Ngọc','0977654321',null),
  ];
  const s={products,customers,orders:[],stockLog:[],seq:1000,sample:true};
  // Đơn mẫu trong 14 ngày gần nhất
  let rnd=7;const r=()=>{rnd=(rnd*9301+49297)%233280;return rnd/233280};
  const sellable=products.filter(p=>!p.service);
  for(let d=13;d>=0;d--){
    const n=2+Math.floor(r()*4);
    for(let k=0;k<n;k++){
      const t=startOfDay(Date.now()-d*86400000)+ (9+Math.floor(r()*11))*3600000+Math.floor(r()*60)*60000;
      if(t>Date.now())continue;
      const items=[];const a=sellable[Math.floor(r()*sellable.length)];
      items.push({pid:a.id,name:a.name,sku:a.sku,price:a.price,cost:a.cost,qty:1});
      if(a.cat==='Gọng kính'){const l=products.filter(p=>p.cat==='Tròng kính')[Math.floor(r()*4)];items.push({pid:l.id,name:l.name,sku:l.sku,price:l.price,cost:l.cost,qty:1})}
      if(r()>.6){const x=products[14];items.push({pid:x.id,name:x.name,sku:x.sku,price:x.price,cost:x.cost,qty:1})}
      const sub=items.reduce((a,i)=>a+i.price*i.qty,0);
      const disc=r()>.75?Math.round(sub*0.1/1000)*1000:0;
      const cust=r()>.4?customers[Math.floor(r()*customers.length)]:null;
      const m=['cash','bank','card'][Math.floor(r()*3)];
      s.orders.push({id:uid(),code:'DH'+(++s.seq),date:t,customerId:cust?cust.id:null,items,subtotal:sub,discount:disc,total:sub-disc,method:m,paid:sub-disc,status:'done',note:'',rx:cust?cust.rx:null,sample:true});
    }
  }
  return s;
}

function modal(html,{wide=false,onMount}={}){
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="modal${wide?' wide':''}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(ov);

  return close;
}

function checkout(){
  if(!cart.items.length)return;
  const t=cartTotals();
  if(cart.method==='cash'&&cart.given&&parseNum(cart.given)<t.total){toast('Khách đưa chưa đủ tiền');return}
  for(const i of cart.items){const p=prod(i.pid);if(p&&!p.service&&i.qty>p.stock){toast(`"${p.name}" không đủ tồn kho`);return}}
  const online=cart.channel!=='pos';
  if(online&&!cart.customerId){toast('Đơn online cần chọn khách hàng');return}
  if(cart.channel==='ctv'&&!cart.ctvId){toast('Hãy chọn cộng tác viên');return}
  const cu=cust(cart.customerId);const ctv=S.ctvs.find(x=>x.id===cart.ctvId);
  const o={id:uid(),code:'DH'+(++S.seq),date:Date.now(),customerId:cart.customerId,items:cart.items.map(i=>({...i})),subtotal:t.sub,discount:t.disc,shipFee:t.ship,total:t.total,method:cart.method,paid:online?0:(cart.method==='cash'&&cart.given?parseNum(cart.given):t.total),status:online?'pending':'done',channel:cart.channel,address:online?cart.address:'',note:cart.note,rx:cu&&cu.rx?JSON.parse(JSON.stringify(cu.rx)):null};
  if(ctv&&cart.channel==='ctv'){o.ctvId=ctv.id;o.commission=Math.round((t.sub-t.disc)*ctv.rate/100)}
  o.items.forEach(i=>{const p=prod(i.pid);if(p&&!p.service){p.stock-=i.qty;S.stockLog.push({id:uid(),date:o.date,pid:p.id,qty:-i.qty,type:'ban',note:o.code})}});
  S.orders.push(o);save();resetCart();renderCart();renderGrid();
  if(online){toast('Đã tạo đơn '+o.code+', đang chờ xác nhận');showReceipt(o)}else showReceipt(o,true);
}

        ${o.shipFee?`<div class="sumrow"><span>Phí giao hàng</span><span>${money(o.shipFee)}</span></div>`:''}
        <div class="sumrow" style="font-weight:700;font-size:16px"><span>Tổng cộng</span><span>${money(o.total)}</span></div>

  {onMount:(m,close)=>{

    const ns=$('#nextS',m);ns&&(ns.onclick=()=>{if(o.status==='pending')o.status='shipping';else if(o.status==='shipping'){o.status='done';o.paid=o.total;o.doneAt=Date.now()}save();close();route();toast('Đơn '+o.code+': '+STATUS[o.status][0])});
    const c=$('#cancelO',m);c&&(c.onclick=()=>{close();confirmBox(`Hủy đơn ${o.code}? Hàng sẽ được cộng lại vào kho.`,'Hủy đơn',()=>{o.status='cancelled';o.items.forEach(i=>{const p=prod(i.pid);if(p&&!p.service){p.stock+=i.qty;S.stockLog.push({id:uid(),date:Date.now(),pid:p.id,qty:i.qty,type:'huy',note:'Hủy '+o.code})}});save();route();toast('Đã hủy đơn '+o.code)})});
  }});
}

/* ============ Đơn hàng ============ */
let ordFilter={q:'',range:'7',status:'all',ch:'all'};
function ordersTable(list){
  if(!list.length)return '<div class="empty">Chưa có đơn hàng.</div>';
  return `<table><thead><tr><th>Mã đơn</th><th>Thời gian</th><th>Khách hàng</th><th>Kênh</th><th class="r">Tổng tiền</th><th>Trạng thái</th></tr></thead><tbody>${list.map(o=>{const c=cust(o.customerId);return `<tr class="click" data-oid="${o.id}"><td><b>${esc(o.code)}</b></td><td class="num">${fmtDT(o.date)}</td><td>${c?esc(c.name):'<span class="muted">Khách lẻ</span>'}</td><td>${CHANNELS[o.channel||'pos']}</td><td class="r num"><b>${money(o.total)}</b></td><td>${statusPill(o.status)}</td></tr>`}).join('')}</tbody></table>`;
}
function bindOrderRows(el){$$('[data-oid]',el).forEach(r=>r.onclick=()=>showReceipt(S.orders.find(o=>o.id===r.dataset.oid)))}
function viewOrders(el){
  el.innerHTML=`<div class="head"><h1>Đơn hàng</h1><span class="grow"></span><button class="btn" id="impSheet">Nhập đơn CTV từ Google Sheet</button><a class="btn pri" href="#ban-hang">+ Tạo đơn</a></div>
  <div class="card">
    <div class="grid4" style="margin-bottom:12px">
      <input id="oq" placeholder="Tìm mã đơn, tên hoặc SĐT khách" value="${esc(ordFilter.q)}">
      <select id="or"><option value="1">Hôm nay</option><option value="7">7 ngày qua</option><option value="30">30 ngày qua</option><option value="all">Tất cả</option></select>
      <select id="os"><option value="all">Mọi trạng thái</option>${Object.entries(STATUS).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select>
      <select id="och"><option value="all">Mọi kênh bán</option>${Object.entries(CHANNELS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>
    </div>
    <div id="olist"></div>
  </div>`;
  $('#or',el).value=ordFilter.range;$('#os',el).value=ordFilter.status;
  const draw=()=>{
    const q=norm(ordFilter.q);const from=ordFilter.range==='all'?0:startOfDay()-(Number(ordFilter.range)-1)*86400000;
    const list=S.orders.filter(o=>o.date>=from&&(ordFilter.status==='all'||o.status===ordFilter.status)&&(ordFilter.ch==='all'||(o.channel||'pos')===ordFilter.ch)&&(!q||norm(o.code+' '+(cust(o.customerId)?.name||'')+' '+(cust(o.customerId)?.phone||'')).includes(q))).sort((a,b)=>b.date-a.date);
    const tot=list.filter(o=>o.status==='done').reduce((a,o)=>a+o.total,0);
    $('#olist',el).innerHTML=`<div class="small muted" style="margin-bottom:8px">${list.length} đơn · Doanh thu hoàn thành <b class="num" style="color:var(--fg)">${money(tot)}</b></div><div class="tbl-wrap">${ordersTable(list)}</div>`;
    bindOrderRows(el);
  };
  $('#oq',el).oninput=e=>{ordFilter.q=e.target.value;draw()};
  $('#impSheet',el).onclick=importSheet;
  $('#or',el).onchange=e=>{ordFilter.range=e.target.value;draw()};
  $('#os',el).onchange=e=>{ordFilter.status=e.target.value;draw()};
  $('#och',el).value=ordFilter.ch;$('#och',el).onchange=e=>{ordFilter.ch=e.target.value;draw()};
  draw();
}

/* ============ Sản phẩm ============ */
let prodFilter={q:'',cat:'Tất cả'};
function viewProducts(el){
  el.innerHTML=`<div class="head"><h1>Sản phẩm</h1><span class="grow"></span><button class="btn pri" id="addP">+ Thêm sản phẩm</button></div>
  <div class="card">
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px"><input id="pq" placeholder="Tìm tên, SKU, thương hiệu" style="flex:1;min-width:200px" value="${esc(prodFilter.q)}"><select id="pc" style="width:auto">${['Tất cả',...CATS].map(c=>`<option${c===prodFilter.cat?' selected':''}>${c}</option>`).join('')}</select></div>
    <div id="plist"></div>
  </div>`;
  const draw=()=>{
    const q=norm(prodFilter.q);
    const list=S.products.filter(p=>(prodFilter.cat==='Tất cả'||p.cat===prodFilter.cat)&&(!q||norm(p.name+' '+p.sku+' '+p.brand).includes(q)));
    $('#plist',el).innerHTML=list.length?`<div class="tbl-wrap"><table><thead><tr><th>Sản phẩm</th><th>Nhóm</th><th class="r">Giá bán</th><th class="r">Giá vốn</th><th class="r">Lãi gộp</th><th>Tồn kho</th></tr></thead><tbody>${list.map(p=>`<tr class="click" data-pid="${p.id}"><td><b>${esc(p.name)}</b><div class="small muted">${esc(p.sku)}${p.brand?' · '+esc(p.brand):''}</div></td><td>${esc(p.cat)}</td><td class="r num">${money(p.price)}</td><td class="r num muted">${money(p.cost)}</td><td class="r num">${p.price?Math.round((p.price-p.cost)/p.price*100)+'%':'—'}</td><td>${stockPill(p)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Không có sản phẩm nào.</div>';
    $$('[data-pid]',el).forEach(r=>r.onclick=()=>editProduct(prod(r.dataset.pid)));
  };
  $('#pq',el).oninput=e=>{prodFilter.q=e.target.value;draw()};
  $('#pc',el).onchange=e=>{prodFilter.cat=e.target.value;draw()};
  $('#addP',el).onclick=()=>editProduct(null);
  draw();
}
function editProduct(p){
  const isNew=!p;p=p||{name:'',sku:'',cat:'Gọng kính',brand:'',price:0,cost:0,stock:0,barcode:''};
  modal(`<h2>${isNew?'Thêm sản phẩm':'Sửa sản phẩm'}</h2>
    <form id="pf" style="display:flex;flex-direction:column;gap:12px">
      <label class="f">Tên sản phẩm *<input id="p_name" required value="${esc(p.name)}"></label>
      <div class="grid2"><label class="f">Mã SKU *<input id="p_sku" required value="${esc(p.sku)}"></label><label class="f">Mã vạch<input id="p_bar" value="${esc(p.barcode)}"></label></div>
      <div class="grid2"><label class="f">Nhóm hàng<select id="p_cat">${CATS.map(c=>`<option${c===p.cat?' selected':''}>${c}</option>`).join('')}</select></label><label class="f">Thương hiệu<input id="p_brand" value="${esc(p.brand)}"></label></div>
      <div class="grid3"><label class="f">Giá bán (₫)<input id="p_price" inputmode="numeric" value="${p.price||''}"></label><label class="f">Giá vốn (₫)<input id="p_cost" inputmode="numeric" value="${p.cost||''}"></label><label class="f">${isNew?'Tồn ban đầu':'Tồn kho (sửa ở Kho hàng)'}<input id="p_stock" inputmode="numeric" value="${p.service?'':p.stock??0}" ${isNew?'':'disabled'}></label></div>
      <div class="acts">${isNew?'':'<button type="button" class="btn danger" id="delP" style="margin-right:auto">Xóa</button>'}<button type="button" class="btn" data-close>Thôi</button><button class="btn pri">Lưu</button></div>
    </form>`,{onMount:(m,close)=>{
      $('#pf',m).onsubmit=e=>{e.preventDefault();
        const sku=$('#p_sku',m).value.trim();
        if(S.products.some(x=>x!==p&&x.sku.toLowerCase()===sku.toLowerCase())){toast('Mã SKU đã tồn tại');return}
        const cat=$('#p_cat',m).value;
        Object.assign(p,{name:$('#p_name',m).value.trim(),sku,barcode:$('#p_bar',m).value.trim(),cat,brand:$('#p_brand',m).value.trim(),price:parseNum($('#p_price',m).value),cost:parseNum($('#p_cost',m).value),service:cat==='Dịch vụ'});
        if(isNew){p.id=uid();p.stock=p.service?null:parseNum($('#p_stock',m).value);S.products.push(p);if(p.stock)S.stockLog.push({id:uid(),date:Date.now(),pid:p.id,qty:p.stock,type:'nhap',note:'Tồn ban đầu'})}
        else if(p.service)p.stock=null;else if(p.stock==null)p.stock=0;
        save();close();route();toast('Đã lưu sản phẩm');
      };
      const d=$('#delP',m);d&&(d.onclick=()=>{close();confirmBox(`Xóa sản phẩm "${p.name}"? Đơn hàng cũ vẫn giữ nguyên.`,'Xóa',()=>{S.products=S.products.filter(x=>x!==p);save();route();toast('Đã xóa sản phẩm')})});
    }});
}

/* ============ Kho hàng ============ */
let stockTab='ton';
function viewStock(el){
  const goods=S.products.filter(p=>!p.service);
  const val=goods.reduce((a,p)=>a+p.stock*p.cost,0);
  el.innerHTML=`<div class="head"><h1>Kho hàng</h1><span class="grow"></span><button class="btn" id="kiem">Kiểm kho</button><button class="btn pri" id="nhap">+ Nhập hàng</button></div>
  <div class="stats" style="grid-template-columns:repeat(3,minmax(0,1fr))">
    <div class="card stat"><div class="lb">Tổng số lượng tồn</div><div class="v num">${goods.reduce((a,p)=>a+Math.max(0,p.stock),0).toLocaleString('vi-VN')}</div></div>
    <div class="card stat"><div class="lb">Giá trị tồn (giá vốn)</div><div class="v num">${money(val)}</div></div>
    <div class="card stat"><div class="lb">Hết / sắp hết</div><div class="v num" style="color:var(--warn)">${goods.filter(p=>p.stock<=3).length}</div></div>
  </div>
  <div class="card"><div class="tabs"><button data-t="ton" class="${stockTab==='ton'?'on':''}">Tồn kho</button><button data-t="ls" class="${stockTab==='ls'?'on':''}">Lịch sử xuất nhập</button></div><div id="sbody"></div></div>`;
  $$('.tabs button',el).forEach(b=>b.onclick=()=>{stockTab=b.dataset.t;viewStock(el)});
  const body=$('#sbody',el);
  if(stockTab==='ton'){
    body.innerHTML=goods.length?`<div class="tbl-wrap"><table><thead><tr><th>Sản phẩm</th><th>Nhóm</th><th class="r">Tồn</th><th class="r">Giá trị tồn</th><th>Trạng thái</th></tr></thead><tbody>${[...goods].sort((a,b)=>a.stock-b.stock).map(p=>`<tr><td><b>${esc(p.name)}</b><div class="small muted">${esc(p.sku)}</div></td><td>${esc(p.cat)}</td><td class="r num">${p.stock}</td><td class="r num">${money(p.stock*p.cost)}</td><td>${stockPill(p)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Chưa có hàng hóa.</div>';
  }else{
    const TY={nhap:['Nhập hàng','good'],ban:['Bán hàng','neu'],huy:['Hủy đơn','warn'],kiem:['Kiểm kho','warn']};
    const log=[...S.stockLog].sort((a,b)=>b.date-a.date).slice(0,200);
    body.innerHTML=log.length?`<div class="tbl-wrap"><table><thead><tr><th>Thời gian</th><th>Sản phẩm</th><th>Loại</th><th class="r">Số lượng</th><th>Ghi chú</th></tr></thead><tbody>${log.map(l=>{const p=prod(l.pid);return `<tr><td class="num">${fmtDT(l.date)}</td><td>${p?esc(p.name):'<span class="muted">(đã xóa)</span>'}</td><td><span class="pill ${TY[l.type][1]}">${TY[l.type][0]}</span></td><td class="r num" style="color:${l.qty>0?'var(--good)':'var(--bad)'}">${l.qty>0?'+':''}${l.qty}</td><td class="muted">${esc(l.note)}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Chưa có phát sinh xuất nhập kho.</div>';
  }
  $('#nhap',el).onclick=()=>stockForm('nhap');
  $('#kiem',el).onclick=()=>stockForm('kiem');
}
function stockForm(type){
  const goods=S.products.filter(p=>!p.service);
  if(!goods.length){toast('Hãy thêm sản phẩm trước');return}
  let lines=[];
  const isN=type==='nhap';
  modal(`<h2>${isN?'Phiếu nhập hàng':'Phiếu kiểm kho'}</h2>
    <div class="small muted">${isN?'Chọn sản phẩm và số lượng nhập thêm. Có thể cập nhật giá vốn mới.':'Nhập số lượng thực tế đếm được. Hệ thống sẽ điều chỉnh tồn kho theo số thực tế.'}</div>
    <select id="sp"><option value="">— Chọn sản phẩm để thêm —</option>${goods.map(p=>`<option value="${p.id}">${esc(p.sku)} · ${esc(p.name)} (tồn ${p.stock})</option>`).join('')}</select>
    <div id="sl" class="tbl-wrap"></div>
    <label class="f">Ghi chú<input id="snote" placeholder="${isN?'VD: Nhập từ NCC Chemi, HĐ 0123':'VD: Kiểm kho cuối tháng'}"></label>
    <div class="acts"><button class="btn" data-close>Thôi</button><button class="btn pri" id="sOk">${isN?'Nhập kho':'Cập nhật tồn'}</button></div>`,
  {wide:true,onMount:(m,close)=>{
    const draw=()=>{$('#sl',m).innerHTML=lines.length?`<table><thead><tr><th>Sản phẩm</th><th class="r">Tồn hiện tại</th><th class="r">${isN?'SL nhập':'SL thực tế'}</th>${isN?'<th class="r">Giá vốn</th>':''}<th></th></tr></thead><tbody>${lines.map((l,i)=>{const p=prod(l.pid);return `<tr><td>${esc(p.name)}</td><td class="r num">${p.stock}</td><td class="r"><input data-i="${i}" data-k="qty" value="${l.qty}" inputmode="numeric" style="width:80px;text-align:right"></td>${isN?`<td class="r"><input data-i="${i}" data-k="cost" value="${l.cost}" inputmode="numeric" style="width:110px;text-align:right"></td>`:''}<td><button class="btn sm danger" data-x="${i}">Bỏ</button></td></tr>`}).join('')}</tbody></table>`:'<div class="empty">Chưa chọn sản phẩm nào.</div>';
      $$('[data-i]',m).forEach(inp=>inp.onchange=()=>{lines[inp.dataset.i][inp.dataset.k]=parseNum(inp.value)});
      $$('[data-x]',m).forEach(b=>b.onclick=()=>{lines.splice(b.dataset.x,1);draw()});
    };
    $('#sp',m).onchange=e=>{const p=prod(e.target.value);if(p&&!lines.some(l=>l.pid===p.id))lines.push({pid:p.id,qty:isN?1:p.stock,cost:p.cost});e.target.value='';draw()};
    $('#sOk',m).onclick=()=>{
      if(!lines.length){toast('Chưa chọn sản phẩm');return}
      const note=$('#snote',m).value.trim();const now=Date.now();
      lines.forEach(l=>{const p=prod(l.pid);
        if(isN){if(l.qty>0){p.stock+=l.qty;if(l.cost)p.cost=l.cost;S.stockLog.push({id:uid(),date:now,pid:p.id,qty:l.qty,type:'nhap',note})}}
        else{const diff=l.qty-p.stock;if(diff){p.stock=l.qty;S.stockLog.push({id:uid(),date:now,pid:p.id,qty:diff,type:'kiem',note})}}
      });
      save();close();stockTab='ls';route();toast(isN?'Đã nhập kho':'Đã cập nhật tồn kho');
    };
    draw();
  }});
}

/* ============ Khách hàng ============ */
let custQ='',custTab='kh';
function viewCustomers(el){
  el.innerHTML=`<div class="head"><h1>Khách hàng</h1><span class="grow"></span>${custTab==='kh'?'<button class="btn pri" id="addC">+ Thêm khách hàng</button>':''}</div>
  <div class="card"><div class="tabs"><button data-t="kh" class="${custTab==='kh'?'on':''}">Khách hàng</button><button data-t="ctv" class="${custTab==='ctv'?'on':''}">Cộng tác viên</button></div><div id="ctab"></div></div>`;
  $$('.tabs button',el).forEach(b=>b.onclick=()=>{custTab=b.dataset.t;viewCustomers(el)});
  if(custTab==='ctv'){viewCtvs($('#ctab',el));return}
  $('#ctab',el).innerHTML=`<input id="cq" placeholder="Tìm tên hoặc số điện thoại" value="${esc(custQ)}" style="margin-bottom:12px"><div id="clist"></div>`;
  const draw=()=>{
    const q=norm(custQ);
    const stats=id=>{const os=validOrders().filter(o=>o.customerId===id);return {n:os.length,sum:os.reduce((a,o)=>a+o.total,0),last:os.reduce((a,o)=>Math.max(a,o.date),0)}};
    const list=S.customers.filter(c=>!q||norm(c.name+' '+c.phone).includes(q)).map(c=>({c,s:stats(c.id)})).sort((a,b)=>b.s.sum-a.s.sum);
    $('#clist',el).innerHTML=list.length?`<div class="tbl-wrap"><table><thead><tr><th>Khách hàng</th><th>SĐT</th><th class="r">Số đơn</th><th class="r">Tổng chi tiêu</th><th>Mua gần nhất</th><th>Đơn kính</th></tr></thead><tbody>${list.map(({c,s})=>`<tr class="click" data-cid="${c.id}"><td><b>${esc(c.name)}</b></td><td class="num">${esc(c.phone)}</td><td class="r num">${s.n}</td><td class="r num"><b>${money(s.sum)}</b></td><td class="num">${s.last?fmtDate(s.last):'—'}</td><td>${c.rx?'<span class="pill good">Có</span>':'<span class="pill neu">Chưa</span>'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Chưa có khách hàng.</div>';
    $$('[data-cid]',el).forEach(r=>r.onclick=()=>customerDetail(cust(r.dataset.cid)));
  };
  $('#cq',el).oninput=e=>{custQ=e.target.value;draw()};
  $('#addC',el).onclick=()=>editCustomer(null,()=>route());
  draw();

function barList(rows,total){
  if(!rows.length)return '<div class="empty">Chưa có dữ liệu.</div>';
  const max=Math.max(...rows.map(r=>r[1]));
  return `<div class="bar-list">${rows.map(([k,v])=>`<div class="row"><span>${esc(k)}</span><span class="num"><b>${money(v)}</b> <span class="muted">${total?Math.round(v/total*100):0}%</span></span><div class="track"><div class="fill" style="width:${max?v/max*100:0}%"></div></div></div>`).join('')}</div>`;
}
function barChart(days){
  const W=640,H=240,L=58,B=26,T=10,R=8;const max=Math.max(1,...days.map(d=>d.v));
  const step=niceStep(max/4);const top=Math.ceil(max/step)*step;
  const y=v=>T+(H-T-B)*(1-v/top);const bw=(W-L-R)/days.length;
  let g='';for(let v=0;v<=top;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${short(v)}</text>`}
  const every=Math.ceil(days.length/10);
  const bars=days.map((d,i)=>{const x=L+i*bw+bw*.18,w=bw*.64,h=y(0)-y(d.v);const last=i===days.length-1;
    return `<rect x="${x}" y="${y(d.v)}" width="${w}" height="${Math.max(0,h)}" rx="2" fill="var(--accent)" opacity="${last?1:.72}"><title>${fmtDate(d.t)}: ${money(d.v)} (${d.n} đơn)</title></rect>${i%every===0||last?`<text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${new Date(d.t).getDate()}/${new Date(d.t).getMonth()+1}</text>`:''}`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ doanh thu theo ngày">${g}${bars}</svg>`;
}
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x||1)));const f=x/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function short(v){return v>=1e6?(v/1e6).toLocaleString('vi-VN',{maximumFractionDigits:1})+'tr':v>=1e3?(v/1e3)+'k':String(v)}

function normPhone(p){p=String(p||'').replace(/[^\d+]/g,'');if(p.startsWith('+84'))p='0'+p.slice(3);else if(p.startsWith('84')&&p.length===11)p='0'+p.slice(2);return p}
function findProductsIn(text){
  const t=norm(text);const found=[];
  const sorted=[...S.products].sort((a,b)=>b.name.length-a.name.length);
  const used=[];
  for(const p of sorted){
    for(const key of [norm(p.sku),norm(p.name),norm(p.name.replace(/\s*\([^)]*\)\s*/g,' ')).trim()]){
      if(!key)continue;const at=t.indexOf(key);
      if(at<0||used.some(([a,b])=>at<b&&at+key.length>a))continue;
      used.push([at,at+key.length]);
      const after=t.slice(at+key.length,at+key.length+16).match(/^\s*[,:-]?\s*(?:x|sl|so luong)?\s*:?\s*(\d{1,2})\b/);
      const before=t.slice(Math.max(0,at-12),at).match(/(\d{1,2})\s*(?:cai|chiec|cap|hop|x)?\s*$/);
      found.push({p,qty:Number((after&&after[1])||(before&&before[1])||1)});break;
    }
  }
  return found;
}
function parseMessage(txt){
  const lines=txt.split(/\n+/).map(l=>l.trim()).filter(Boolean);
  const pm=txt.match(/(?:\+?84|0)(?:[\s.\-]?\d){9}/);
  const field=re=>{for(const l of lines){const m=l.match(re);if(m&&m[1].trim())return m[1].trim()}return ''};
  let name=field(/^(?:họ\s*tên|tên|ten|người nhận|nguoi nhan|khách|khach)\s*[:\-]\s*(.+)$/i);
  let address=field(/^(?:địa chỉ|dia chi|đ\/c|d\/c|đc|dc|giao (?:đến|tới|về))\s*[:\-]?\s*(.+)$/i);
  if(!address){const l=lines.find(l=>/(phường|quận|huyện|xã|thị trấn|tỉnh|tp\.?\s|thành phố|đường|\bp\.\s?\d|\bq\.\s?\d)/i.test(l));if(l)address=l.replace(/^[^:]*:\s*/,'')}
  const ship=field(/^(?:phí ship|phi ship|ship|phí giao)\s*[:\-]?\s*(.+)$/i);
  return {name,phone:pm?normPhone(pm[0]):'',address,items:findProductsIn(txt),shipFee:ship?parseNum(ship)*(/k\b/i.test(ship)&&parseNum(ship)<1000?1000:1):0};
}

/* ============ Nhập đơn cộng tác viên từ Google Sheet ============ */
const SHEET_COLS={
  code:['ma don','ma dh','order id','id don','so don'],
  date:['ngay','ngay dat','thoi gian','timestamp','dau thoi gian'],
  ctv:['ctv','cong tac vien','nguoi ban','ten ctv','ma ctv'],
  name:['ten khach','ho ten','khach hang','ten','nguoi nhan','ten nguoi nhan'],
  phone:['sdt','so dien thoai','dien thoai','phone','sdt khach'],
  address:['dia chi','dia chi giao','dia chi nhan'],
  product:['san pham','ma sp','sku','ten san pham','hang','mat hang'],
  qty:['so luong','sl','qty'],
  price:['gia','don gia','gia ban'],
  ship:['phi ship','phi giao','ship','phi van chuyen'],
  note:['ghi chu','note'],
};
function parseSheet(txt){
  const rows=txt.replace(/\r/g,'').split('\n').filter(l=>l.trim()).map(l=>l.includes('\t')?l.split('\t'):splitCSV(l));
  if(rows.length<2)return {err:'Cần ít nhất dòng tiêu đề và một dòng đơn.'};
  const head=rows[0].map(h=>norm(h).trim());const map={};
  for(const [k,names] of Object.entries(SHEET_COLS)){const i=head.findIndex(h=>names.includes(h));if(i<0){const j=head.findIndex(h=>names.some(n=>n.length>3&&h.includes(n)));if(j>=0)map[k]=j}else map[k]=i}
  if(map.phone==null||map.product==null)return {err:'Không thấy cột Số điện thoại hoặc Sản phẩm trong dòng tiêu đề.',head:rows[0]};
  const groups=new Map();
  rows.slice(1).forEach((r,ix)=>{
    const g=k=>map[k]!=null?(r[map[k]]||'').trim():'';
    const code=g('code')||('dong-'+(ix+2)+'-'+normPhone(g('phone')));
    if(!groups.has(code))groups.set(code,{code,ext:!!g('code'),row:ix+2,ctv:g('ctv'),name:g('name'),phone:normPhone(g('phone')),address:g('address'),ship:parseNum(g('ship')),note:g('note'),date:g('date'),lines:[],errs:[]});
    const o=groups.get(code);
    const pq=g('product');const hit=findProductsIn(pq)[0];
    const qty=parseNum(g('qty'))||(hit?hit.qty:1);
    if(!pq)return;
    if(!hit)o.errs.push(`Không tìm thấy sản phẩm "${pq}"`);
    else o.lines.push({p:hit.p,qty,price:parseNum(g('price'))||hit.p.price});
  });
  const list=[...groups.values()];
  list.forEach(o=>{
    if(!o.phone)o.errs.push('Thiếu số điện thoại');
    if(o.ext&&S.orders.some(x=>x.extCode===o.code))o.dup=true;
    if(!o.lines.length&&!o.errs.length)o.errs.push('Không có sản phẩm');
  });
  return {list,map};
}
function splitCSV(l){const out=[];let cur='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(q){if(ch==='"'&&l[i+1]==='"'){cur+='"';i++}else if(ch==='"')q=false;else cur+=ch}else if(ch==='"')q=true;else if(ch===','){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out}
function importSheet(){
  const sample=['Mã đơn\tNgày\tCTV\tTên khách\tSĐT\tĐịa chỉ\tSản phẩm\tSố lượng\tPhí ship\tGhi chú',
    'CTV-0001\t26/11/2026\tĐỗ Thị Mai (CTV)\tNguyễn Văn Bình\t0901234567\t8 Hai Bà Trưng, Hoàn Kiếm, Hà Nội\tGK-AC-002\t1\t30000\tCắt tròng -1.50',
    'CTV-0001\t26/11/2026\tĐỗ Thị Mai (CTV)\tNguyễn Văn Bình\t0901234567\t8 Hai Bà Trưng, Hoàn Kiếm, Hà Nội\tTK-156-AS\t1\t\t',
    'CTV-0002\t26/11/2026\tVũ Đức Long (CTV)\tTrần Thị Hoa\t0977888999\t21 Trần Phú, Hải Châu, Đà Nẵng\tLens 1 ngày hộp 30 miếng\t2\t25000\t'].join('\n');
  modal(`<h2>Nhập đơn cộng tác viên từ Google Sheet</h2>
    <div class="small muted">Mở Google Sheet đơn hàng, chọn các dòng cần nhập (kèm dòng tiêu đề), bấm Ctrl+C rồi dán vào ô dưới. Phần mềm tự nhận các cột Mã đơn, CTV, Tên khách, SĐT, Địa chỉ, Sản phẩm (tên hoặc mã SKU), Số lượng, Phí ship, Ghi chú. Các dòng cùng Mã đơn gộp thành một đơn, mã đơn đã nhập trước đó sẽ được bỏ qua.</div>
    <textarea id="sh_txt" rows="6" placeholder="Dán dữ liệu từ Google Sheet vào đây"></textarea>
    <div><button class="btn sm" id="sh_try">Dùng dữ liệu ví dụ</button></div>
    <div id="sh_res" class="tbl-wrap"></div>
    <div class="acts"><button class="btn" data-close>Thôi</button><button class="btn pri" id="sh_ok" disabled>Nhập đơn</button></div>`,
  {wide:true,onMount:(m,close)=>{
    let res=null;
    const run=()=>{
      const txt=$('#sh_txt',m).value;if(!txt.trim()){$('#sh_res',m).innerHTML='';$('#sh_ok',m).disabled=true;return}
      res=parseSheet(txt);
      if(res.err){$('#sh_res',m).innerHTML=`<div class="banner" style="margin:0">${esc(res.err)}${res.head?' Tiêu đề đang có: '+res.head.map(esc).join(', '):''}</div>`;$('#sh_ok',m).disabled=true;return}
      const ok=res.list.filter(o=>!o.errs.length&&!o.dup);
      $('#sh_res',m).innerHTML=`<div class="small" style="margin-bottom:6px">${ok.length} đơn sẽ được nhập · ${res.list.length-ok.length} đơn bỏ qua</div><table><thead><tr><th>Mã đơn</th><th>CTV</th><th>Khách</th><th>Sản phẩm</th><th class="r">Tổng</th><th>Kiểm tra</th></tr></thead><tbody>${res.list.map(o=>{const tot=o.lines.reduce((a,l)=>a+l.price*l.qty,0)+o.ship;return `<tr><td>${o.ext?esc(o.code):'<span class="muted">dòng '+o.row+'</span>'}</td><td>${esc(o.ctv||'—')}</td><td>${esc(o.name)}<div class="small muted num">${esc(o.phone)}</div></td><td class="small">${o.lines.map(l=>esc(l.p.name)+' × '+l.qty).join('<br>')}</td><td class="r num">${money(tot)}</td><td>${o.dup?'<span class="pill neu">Đã nhập rồi</span>':o.errs.length?`<span class="pill bad">Lỗi</span><div class="small" style="color:var(--bad)">${o.errs.map(esc).join('<br>')}</div>`:'<span class="pill good">Hợp lệ</span>'}</td></tr>`}).join('')}</tbody></table>`;
      $('#sh_ok',m).disabled=!ok.length;
    };
    $('#sh_txt',m).oninput=run;
    $('#sh_try',m).onclick=()=>{$('#sh_txt',m).value=sample;run()};
    $('#sh_ok',m).onclick=()=>{
      const ok=res.list.filter(o=>!o.errs.length&&!o.dup);let n=0;const short=[];
      ok.forEach(g=>{
        let c=S.customers.find(x=>x.phone===g.phone);
        if(!c){c={id:uid(),name:g.name||'Khách '+g.phone,phone:g.phone,note:'',rx:null,createdAt:Date.now()};S.customers.push(c)}
        let ctv=null;
        if(g.ctv){ctv=S.ctvs.find(x=>norm(x.name)===norm(g.ctv)||x.phone===normPhone(g.ctv));if(!ctv){ctv={id:uid(),name:g.ctv,phone:'',rate:10};S.ctvs.push(ctv)}}
        const items=g.lines.map(l=>({pid:l.p.id,name:l.p.name,sku:l.p.sku,price:l.price,cost:l.p.cost,qty:l.qty}));
        const sub=items.reduce((a,i)=>a+i.price*i.qty,0);
        const o={id:uid(),code:'DH'+(++S.seq),extCode:g.ext?g.code:'',date:Date.now(),customerId:c.id,items,subtotal:sub,discount:0,shipFee:g.ship,total:sub+g.ship,method:'cod',paid:0,status:'pending',channel:'ctv',address:g.address,note:[g.note,g.ext?'Sheet: '+g.code:''].filter(Boolean).join(' · '),rx:c.rx||null};
        if(ctv){o.ctvId=ctv.id;o.commission=Math.round(sub*ctv.rate/100)}
        items.forEach(i=>{const p=prod(i.pid);if(p&&!p.service){if(p.stock<i.qty)short.push(p.name);p.stock-=i.qty;S.stockLog.push({id:uid(),date:o.date,pid:p.id,qty:-i.qty,type:'ban',note:o.code})}});
        S.orders.push(o);n++;
      });
      save();close();ordFilter={q:'',range:'all',status:'pending',ch:'ctv'};
      if(location.hash!=='#don-hang')location.hash='don-hang';else route();
      toast(`Đã nhập ${n} đơn cộng tác viên`+(short.length?'. Tồn kho âm: '+[...new Set(short)].join(', '):''));
    };
  }});
}

/* ============ Cộng tác viên ============ */
function viewCtvs(box){
  const stat=id=>{const os=S.orders.filter(o=>o.ctvId===id&&o.status!=='cancelled');return {n:os.length,rev:os.filter(o=>o.status==='done').reduce((a,o)=>a+o.total,0),com:os.filter(o=>o.status==='done').reduce((a,o)=>a+(o.commission||0),0),pending:os.filter(o=>o.status!=='done').length}};
  box.innerHTML=`<div style="display:flex;justify-content:flex-end;margin-bottom:12px"><button class="btn pri" id="addCtv">+ Thêm cộng tác viên</button></div>`+(S.ctvs.length?`<div class="tbl-wrap"><table><thead><tr><th>Cộng tác viên</th><th>SĐT</th><th class="r">% hoa hồng</th><th class="r">Số đơn</th><th class="r">Doanh thu đã giao</th><th class="r">Hoa hồng phải trả</th></tr></thead><tbody>${S.ctvs.map(x=>{const s=stat(x.id);return `<tr class="click" data-ctv="${x.id}"><td><b>${esc(x.name)}</b>${s.pending?` <span class="pill warn">${s.pending} đang xử lý</span>`:''}</td><td class="num">${esc(x.phone||'—')}</td><td class="r num">${x.rate}%</td><td class="r num">${s.n}</td><td class="r num">${money(s.rev)}</td><td class="r num"><b>${money(s.com)}</b></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Chưa có cộng tác viên. Cộng tác viên cũng được tạo tự động khi nhập đơn từ Google Sheet.</div>');
  $('#addCtv',box).onclick=()=>editCtv(null,()=>viewCtvs(box));
  $$('[data-ctv]',box).forEach(r=>r.onclick=()=>editCtv(S.ctvs.find(x=>x.id===r.dataset.ctv),()=>viewCtvs(box)));
}
function editCtv(x,after){
  const isNew=!x;x=x||{name:'',phone:'',rate:10};
  modal(`<h2>${isNew?'Thêm cộng tác viên':'Sửa cộng tác viên'}</h2><form id="ctf" style="display:flex;flex-direction:column;gap:12px">
    <label class="f">Tên (trùng với tên trong Google Sheet để nhận đơn tự động) *<input id="ct_name" required value="${esc(x.name)}"></label>
    <div class="grid2"><label class="f">Số điện thoại<input id="ct_phone" value="${esc(x.phone)}" inputmode="tel"></label><label class="f">% hoa hồng trên tiền hàng<input id="ct_rate" value="${x.rate}" inputmode="decimal"></label></div>
    <div class="acts"><button type="button" class="btn" data-close>Thôi</button><button class="btn pri">Lưu</button></div></form>`,
  {onMount:(m,close)=>{$('#ctf',m).onsubmit=e=>{e.preventDefault();Object.assign(x,{name:$('#ct_name',m).value.trim(),phone:normPhone($('#ct_phone',m).value),rate:Math.max(0,Math.min(100,Number(String($('#ct_rate',m).value).replace(',','.'))||0))});if(isNew){x.id=uid();S.ctvs.push(x)}save();close();toast('Đã lưu cộng tác viên');after&&after()}}});
}

/* ============ Khởi động ============ */
document.addEventListener('keydown',e=>{
  if(e.key==='F3'){e.preventDefault();if(location.hash!=='#ban-hang')location.hash='ban-hang';setTimeout(()=>$('#posQ')&&$('#posQ').focus(),0)}
  if(e.key==='F9'&&$('#checkout')&&!$('.ov')){e.preventDefault();checkout()}
});
load();route();
</script>

</body>
</html>
