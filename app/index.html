<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#12343a">
<link rel="icon" href="/favicon.ico">
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="apple-touch-icon" href="/app/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Eyemedi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Phần mềm bán hàng | EYEMEDI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: cột điều hướng trái + vùng làm việc; trên điện thoại điều hướng thành thanh dưới. */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --surface-2:#eef2f3; --line:#dde3e6;
  --fg:#17242b; --muted:#5f6f77; --accent:#0d6e74; --accent-fg:#ffffff; --accent-soft:#d9eeee;
  --nav:#12343a; --nav-fg:#cfe3e4; --nav-active:#ffffff;
  --good:#1f7a43; --good-soft:#dcf1e3; --warn:#9a5b00; --warn-soft:#fbecd2; --bad:#b42318; --bad-soft:#fbe0dd;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1719; --surface:#162226; --surface-2:#1c2b30; --line:#2a3b41;
  --fg:#e4ecee; --muted:#93a6ad; --accent:#3fb7bd; --accent-fg:#06272a; --accent-soft:#173c40;
  --nav:#0a1214; --nav-fg:#9fb7bb; --nav-active:#ffffff;
  --good:#5cc98a; --good-soft:#163524; --warn:#e8ac4a; --warn-soft:#3a2a10; --bad:#f07a6e; --bad-soft:#3d1a17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1719; --surface:#162226; --surface-2:#1c2b30; --line:#2a3b41;
  --fg:#e4ecee; --muted:#93a6ad; --accent:#3fb7bd; --accent-fg:#06272a; --accent-soft:#173c40;
  --nav:#0a1214; --nav-fg:#9fb7bb; --nav-active:#ffffff;
  --good:#5cc98a; --good-soft:#163524; --warn:#e8ac4a; --warn-soft:#3a2a10; --bad:#f07a6e; --bad-soft:#3d1a17; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-x:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:216px 1fr;min-height:100%}
nav.side{background:var(--nav);color:var(--nav-fg);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;color:var(--nav-active)}
.brand svg{flex:none}
.brand b{font-size:17px;letter-spacing:.2px}
.brand small{display:block;font-size:11px;color:var(--nav-fg);font-weight:400}
nav.side a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;color:inherit;text-decoration:none;font-weight:500}
nav.side a:hover{background:rgba(255,255,255,.06)}
nav.side a.on{background:rgba(255,255,255,.12);color:var(--nav-active)}
nav.side a svg{width:18px;height:18px;flex:none}
nav.side .spacer{flex:1}
nav.side .foot{font-size:11px;padding:8px 10px;opacity:.8}
main{min-width:0;padding-block:20px 40px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1{font-size:22px;margin:0;text-wrap:balance}
h2{font-size:16px;margin:0 0 10px}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head .grow{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
@media (pointer:coarse),(max-width:900px){input,select,textarea{font-size:16px}}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;background:var(--surface-2)}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neu{background:var(--surface-2);color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:99px;cursor:pointer;font-size:13px}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);color:var(--warn);padding:10px 14px;border-radius:var(--r);margin-bottom:16px;font-weight:500}
.banner .grow{flex:1;min-width:200px}
/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;text-align:left}
.pcard:hover{border-color:var(--accent)}
.pcard .nm{font-weight:600;line-height:1.3}
.pcard .pr{font-weight:700;color:var(--accent);margin-top:auto}
.pcard .meta{font-size:12px;color:var(--muted)}
.cart{position:sticky;top:16px;display:flex;flex-direction:column;gap:12px}
.cline{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.cline .nm{font-weight:600}
main a:not(.btn){color:var(--accent)}
.qty{justify-self:start;display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px}
.qty button{border:0;background:none;width:28px;height:28px;cursor:pointer;font-size:16px}
.qty input{width:44px;border:0;text-align:center;padding:4px;box-shadow:none}
.sumrow{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.sumrow.total{font-size:20px;font-weight:700;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);padding:8px 4px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500}
.seg button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
.sugg{border:1px solid var(--line);border-radius:6px;margin-top:4px;max-height:180px;overflow:auto;background:var(--surface)}
.sugg div{padding:8px 10px;cursor:pointer}
.sugg div:hover{background:var(--surface-2)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.stat .lb{font-size:12px;color:var(--muted);font-weight:500}
.stat .v{font-size:22px;font-weight:700;margin-top:4px}
.stat .d{font-size:12px;margin-top:2px}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.chart svg{width:100%;height:auto;display:block}
.bar-list{display:flex;flex-direction:column;gap:10px}
.bar-list .row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px}
.bar-list .track{grid-column:1/-1;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar-list .fill{height:100%;background:var(--accent)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(8,20,24,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
.modal{background:var(--surface);border-radius:10px;width:100%;max-width:560px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{max-width:760px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.rx{width:100%;border-collapse:collapse}
.rx th,.rx td{border:1px solid var(--line);padding:4px;text-align:center}
.rx td input{border:0;text-align:center;padding:4px;box-shadow:none}
.rx th{background:var(--surface-2);font-size:11px}
.receipt{font-size:13px;border:1px dashed var(--line);padding:16px;border-radius:6px;background:var(--surface-2)}
.receipt .c{text-align:center}
.notice{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:16px}
.notice .who{display:flex;align-items:center;gap:6px;flex-basis:100%;min-width:0}
.notice .who .ctvtop{margin-left:auto;white-space:nowrap}
.nchips{display:flex;flex-wrap:wrap;gap:6px}
.nchip{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:99px;background:var(--surface-2);color:var(--fg)!important;text-decoration:none;font-size:13px}
.nchip.warn{background:var(--warn-soft);color:var(--warn)!important}
.nchip.ok{background:var(--good-soft);color:var(--good)!important}
.nchip.info{background:var(--accent-soft);color:var(--accent)!important}
.nmeta{font-size:12px;color:var(--muted)}.nwarn{color:var(--warn);font-weight:500}
.brsel{display:inline-flex;align-items:center;gap:6px}.brsel select{width:auto;padding:4px 8px}
.nlatest{flex-basis:100%;font-size:12px;color:var(--muted)}
.login{max-width:420px;margin:40px auto;display:flex;flex-direction:column;gap:14px;padding:24px}
.lbrand{display:flex;gap:10px;align-items:center;color:var(--accent)}.lbrand b{font-size:18px;color:var(--fg)}
.lform{display:flex;flex-direction:column;gap:12px}
.sacts{display:flex;flex-wrap:wrap;gap:4px}
.permgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.chk{display:flex;gap:8px;align-items:center;font-size:13px}.chk input{width:auto}
@media (max-width:480px){.permgrid{grid-template-columns:1fr}}
a.btn{color:var(--fg)}a.btn.pri{color:var(--accent-fg)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));right:max(20px,env(safe-area-inset-right,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:6px;z-index:60;font-weight:500}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.login .tabs{flex-wrap:wrap;overflow:visible}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent;font-weight:500;color:var(--muted);white-space:nowrap}
.tabs button.on{border-color:var(--accent);color:var(--fg)}
.kbd{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted)}
@media (max-width:1100px){.pos{grid-template-columns:minmax(0,1fr) 330px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  nav.side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));z-index:40;overflow-x:auto;gap:2px}
  .brand,nav.side .spacer,nav.side .foot{display:none}
  nav.side a{flex-direction:column;gap:2px;font-size:10px;padding:6px 8px;flex:1;min-width:58px}
  main{padding-bottom:90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .pos{grid-template-columns:minmax(0,1fr)}
  .cart{position:static}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .grid3,.grid4{grid-template-columns:1fr 1fr}
}
@media (max-width:480px){.grid2,.grid3,.grid4{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stat .v{font-size:18px}.pgrid{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>

<script src="/ctv/config.js"></script>
<script>
/* ============ Dữ liệu ============ */
const KEY='eyemedi-pos-v1';
const CATS=['Gọng kính','Tròng kính','Kính thời trang','Kính râm','Kính áp tròng','Phụ kiện','Thiết bị','Dịch vụ'];
const METHODS={cash:'Tiền mặt',bank:'Chuyển khoản',card:'Quẹt thẻ',cod:'Thu hộ (COD)'};
const CHANNELS={pos:'Tại quầy',facebook:'Facebook',zalo:'Zalo',chatbot:'Chatbot',ctv:'Cộng tác viên',web:'Website'};
const STATUS={pending:['Chờ xác nhận','warn'],shipping:['Đang giao','neu'],done:['Hoàn thành','good'],cancelled:['Đã hủy','bad']};
const statusPill=s=>`<span class="pill ${STATUS[s][1]}">${STATUS[s][0]}</span>`;
let S;
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const money=n=>(Math.round(n||0)).toLocaleString('vi-VN')+'₫';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=t=>{const d=new Date(t);return d.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'})};
const fmtDT=t=>{const d=new Date(t);return d.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})};
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const startOfDay=(t=Date.now())=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const parseNum=v=>{const n=Number(String(v).replace(/[^\d-]/g,''));return isNaN(n)?0:n};
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');

function save(){if(SERVER)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const r=localStorage.getItem(KEY);if(r){S=JSON.parse(r)}}catch(e){}if(!S)S=seed();migrate()}
function migrate(){
  if(!S.branches)S.branches=DEFAULT_BRANCHES.map(b=>({...b}));
  if(S.sample&&!S._brDone){S._brDone=1;S.orders.forEach((o,i)=>{if(!o.branchId)o.branchId=['cn1','cn2','cn4'][i%3]});S.products.forEach(p=>{if(!p.service&&!p.stocks){const a=Math.ceil(p.stock*0.6);p.stocks={cn1:a,cn2:p.stock-a}}})}
  S.ctvs=S.ctvs||[];
  if(!S.funds)S.funds=DEFAULT_FUNDS.map(f=>({...f}));
  if(!S.cash){S.cash=[];S.cashSeq={thu:0,chi:0};
    if(S.sample){S.funds[0].opening=5000000;S.funds[1].opening=20000000;
      [...S.orders].filter(o=>o.status==='done').sort((a,b)=>a.date-b.date).forEach(o=>cashLocal({type:'thu',fund:fundForMethod(o.method),category:'Bán hàng',amount:o.total,note:'Thu tiền đơn '+o.code,ref:o.code,auto:true,date:o.date,branch:o.branchId}));
      const d0=startOfDay()-12*86400000;
      cashLocal({type:'chi',fund:'ngan_hang',category:'Thuê mặt bằng',amount:15000000,note:'Tiền thuê tháng 11 (ví dụ)',date:d0});
      cashLocal({type:'chi',fund:'tien_mat',category:'Điện, nước, internet',amount:1850000,note:'Điện nước tháng 10 (ví dụ)',date:d0+5*86400000});

  ];

function modal(html,{wide=false,onMount}={}){
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="modal${wide?' wide':''}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(ov);
  const close=()=>{ov.remove();document.removeEventListener('keydown',kd)};
  const kd=e=>{if(e.key==='Escape')close()};
  document.addEventListener('keydown',kd);
  ov.addEventListener('mousedown',e=>{if(e.target===ov)close()});
  $$('[data-close]',ov).forEach(b=>b.onclick=close);
  onMount&&onMount(ov.firstElementChild,close);
  const f=$('input,select,textarea',ov);f&&f.focus();
  return close;
}

async function checkout(){

  for(const i of cart.items){const p=prod(i.pid);if(p&&!p.service&&i.qty>p.stock){toast(`"${p.name}" không đủ tồn kho`);return}}
  const online=cart.channel!=='pos';
  if(online&&!cart.customerId){toast('Đơn online cần chọn khách hàng');return}
  if(cart.channel==='ctv'&&!cart.ctvId){toast('Hãy chọn cộng tác viên');return}
  const cu=cust(cart.customerId);const ctv=S.ctvs.find(x=>x.id===cart.ctvId);
  const o={id:uid(),branchId:CUR_BR,branchName:brName(CUR_BR),code:'DH'+(++S.seq),date:Date.now(),customerId:cart.customerId,items:cart.items.map(i=>({...i})),subtotal:t.sub,discount:t.disc,shipFee:t.ship,total:t.total,method:cart.method,paid:online?0:(cart.method==='cash'&&cart.given?parseNum(cart.given):t.total),status:online?'pending':'done',channel:cart.channel,address:online?cart.address:'',note:cart.note,rx:cu&&cu.rx?JSON.parse(JSON.stringify(cu.rx)):null};
  if(ctv&&cart.channel==='ctv'){o.ctvId=ctv.id;o.commission=Math.round((t.sub-t.disc)*ctv.rate/100)}
  let fin=o;
  if(SERVER){
    const b=$('#checkout');b&&(b.disabled=true,b.textContent='Đang lưu đơn…');
    try{const d=await api('posCreateOrder',{order:o});fin=d.order;S.orders.push(fin);seenOrders&&seenOrders.add(fin.id);mergeProducts(d.products)}
    catch(e){toast(e.message);renderCart();return}
  }else{
    o.items.forEach(i=>{const p=prod(i.pid);if(p&&!p.service){adjStock(p,-i.qty,o.branchId);S.stockLog.push({id:uid(),date:o.date,pid:p.id,qty:-i.qty,type:'ban',note:o.code})}});
    S.orders.push(o);if(o.status==='done')cashForOrderLocal(o,'done');save();
  }
  resetCart();renderCart();renderGrid();renderNotice();
  if(online){toast('Đã tạo đơn '+fin.code+', đang chờ xác nhận');showReceipt(fin)}else showReceipt(fin,true);
}

    <div class="card stat"><div class="lb">Giá trị tồn (giá vốn)</div><div class="v num">${money(val)}</div></div>
    <div class="card stat"><div class="lb">Hết / sắp hết</div><div class="v num" style="color:var(--warn)">${goods.filter(p=>p.stock<=3).length}</div></div>
  </div>
  <div class="card"><div class="tabs"><button data-t="ton" class="${stockTab==='ton'?'on':''}">Tồn kho</button><button data-t="ls" class="${stockTab==='ls'?'on':''}">Lịch sử xuất nhập</button></div><div id="sbody"></div></div>`;

  }else{
    const TY={nhap:['Nhập hàng','good'],ban:['Bán hàng','neu'],huy:['Hủy đơn','warn'],kiem:['Kiểm kho','warn'],chuyen:['Chuyển kho','neu']};
    const log=S.stockLog.filter(l=>CUR_BR==='all'||!l.branch||l.branch===CUR_BR).sort((a,b)=>b.date-a.date).slice(0,200);
    body.innerHTML=log.length?`<div class="tbl-wrap"><table><thead><tr><th>Thời gian</th><th>Sản phẩm</th><th>Loại</th><th class="r">Số lượng</th><th>Ghi chú</th></tr></thead><tbody>${log.map(l=>{const p=prod(l.pid);return `<tr><td class="num">${fmtDT(l.date)}</td><td>${p?esc(p.name):'<span class="muted">(đã xóa)</span>'}</td><td><span class="pill ${TY[l.type][1]}">${TY[l.type][0]}</span></td><td class="r num" style="color:${l.qty>0?'var(--good)':'var(--bad)'}">${l.qty>0?'+':''}${l.qty}</td><td class="muted">${esc(l.note)}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Chưa có phát sinh xuất nhập kho.</div>';
  }
  $('#nhap',el).onclick=()=>stockForm('nhap');
  $('#kiem',el).onclick=()=>stockForm('kiem');
  $('#chuyenKho',el).onclick=transferForm;
}
function stockForm(type){
  if(needBranch('lập phiếu kho'))return;
  const goods=S.products.filter(p=>!p.service);
  if(!goods.length){toast('Hãy thêm sản phẩm trước');return}
  let lines=[];
  const isN=type==='nhap';
  modal(`<h2>${isN?'Phiếu nhập hàng':'Phiếu kiểm kho'}</h2>
    <div class="small muted">${isN?'Chọn sản phẩm và số lượng nhập thêm. Có thể cập nhật giá vốn mới.':'Nhập số lượng thực tế đếm được. Hệ thống sẽ điều chỉnh tồn kho theo số thực tế.'}</div>
    <select id="sp"><option value="">— Chọn sản phẩm để thêm —</option>${goods.map(p=>`<option value="${p.id}">${esc(p.sku)} · ${esc(p.name)} (tồn ${p.stock})</option>`).join('')}</select>
    <div id="sl" class="tbl-wrap"></div>
    ${isN?`<label class="f">Ghi sổ quỹ tiền hàng<select id="spay"><option value="">Không ghi (trả sau, công nợ)</option>${fundsNow().map(f=>`<option value="${f.id}">Chi từ quỹ ${esc(f.name)}</option>`).join('')}</select></label>`:''}
    <label class="f">Ghi chú<input id="snote" placeholder="${isN?'VD: Nhập từ NCC Chemi, HĐ 0123':'VD: Kiểm kho cuối tháng'}"></label>
    <div class="acts"><button class="btn" data-close>Thôi</button><button class="btn pri" id="sOk">${isN?'Nhập kho':'Cập nhật tồn'}</button></div>`,
  {wide:true,onMount:(m,close)=>{
    const draw=()=>{$('#sl',m).innerHTML=lines.length?`<table><thead><tr><th>Sản phẩm</th><th class="r">Tồn hiện tại</th><th class="r">${isN?'SL nhập':'SL thực tế'}</th>${isN?'<th class="r">Giá vốn</th>':''}<th></th></tr></thead><tbody>${lines.map((l,i)=>{const p=prod(l.pid);return `<tr><td>${esc(p.name)}</td><td class="r num">${p.stock}</td><td class="r"><input data-i="${i}" data-k="qty" value="${l.qty}" inputmode="numeric" style="width:80px;text-align:right"></td>${isN?`<td class="r"><input data-i="${i}" data-k="cost" value="${l.cost}" inputmode="numeric" style="width:110px;text-align:right"></td>`:''}<td><button class="btn sm danger" data-x="${i}">Bỏ</button></td></tr>`}).join('')}</tbody></table>`:'<div class="empty">Chưa chọn sản phẩm nào.</div>';
      $$('[data-i]',m).forEach(inp=>inp.onchange=()=>{lines[inp.dataset.i][inp.dataset.k]=parseNum(inp.value)});
      $$('[data-x]',m).forEach(b=>b.onclick=()=>{lines.splice(b.dataset.x,1);draw()});
    };
    $('#sp',m).onchange=e=>{const p=prod(e.target.value);if(p&&!lines.some(l=>l.pid===p.id))lines.push({pid:p.id,qty:isN?1:p.stock,cost:p.cost});e.target.value='';draw()};
    $('#sOk',m).onclick=async()=>{
      if(!lines.length){toast('Chưa chọn sản phẩm');return}
      const note=$('#snote',m).value.trim();const now=Date.now();
      if(SERVER){const b=$('#sOk',m);b.disabled=true;
        try{await api('posStock',{type,lines,note,branch:CUR_BR,payFund:isN&&$('#spay',m)?$('#spay',m).value:''});await refreshData()}catch(err){toast(err.message);b.disabled=false;return}
        close();stockTab='ls';route();toast(isN?'Đã nhập kho':'Đã cập nhật tồn kho');return}
      lines.forEach(l=>{const p=prod(l.pid);
        if(isN){if(l.qty>0){adjStock(p,l.qty,CUR_BR);if(l.cost)p.cost=l.cost;S.stockLog.push({id:uid(),date:now,pid:p.id,qty:l.qty,type:'nhap',note})}}
        else{const diff=l.qty-p.stock;if(diff){adjStock(p,diff,CUR_BR);S.stockLog.push({id:uid(),date:now,pid:p.id,qty:diff,type:'kiem',note})}}
      });
      const pf=isN&&$('#spay',m)?$('#spay',m).value:'';const pay=lines.reduce((a,l)=>a+Math.max(0,l.qty)*(l.cost||0),0);
      if(pf&&pay>0){S.funds=S.funds||DEFAULT_FUNDS.map(f=>({...f}));cashLocal({type:'chi',fund:pf,category:'Nhập hàng',amount:pay,note:'Tiền hàng nhập'+(note?': '+note:''),auto:true,branch:CUR_BR})}
      save();close();stockTab='ls';route();toast(isN?'Đã nhập kho':'Đã cập nhật tồn kho');
    };
    draw();
  }});
}

let custQ='',custTab='kh';
function viewCustomers(el){
  el.innerHTML=`<div class="head"><h1>Khách hàng</h1><span class="grow"></span>${custTab==='kh'?'<button class="btn pri" id="addC">+ Thêm khách hàng</button>':''}</div>
  <div class="card"><div class="tabs"><button data-t="kh" class="${custTab==='kh'?'on':''}">Khách hàng</button><button data-t="ctv" class="${custTab==='ctv'?'on':''}">Cộng tác viên</button></div><div id="ctab"></div></div>`;
  $$('.tabs button',el).forEach(b=>b.onclick=()=>{custTab=b.dataset.t;viewCustomers(el)});
  if(custTab==='ctv'){viewCtvs($('#ctab',el));return}
  $('#ctab',el).innerHTML=`<input id="cq" placeholder="Tìm tên hoặc số điện thoại" value="${esc(custQ)}" style="margin-bottom:12px"><div id="clist"></div>`;
  const draw=()=>{
    const q=norm(custQ);
    const stats=id=>{const os=validOrders().filter(o=>o.customerId===id);return {n:os.length,sum:os.reduce((a,o)=>a+o.total,0),last:os.reduce((a,o)=>Math.max(a,o.date),0)}};
    const list=S.customers.filter(c=>!q||norm(c.name+' '+c.phone).includes(q)).map(c=>({c,s:stats(c.id)})).sort((a,b)=>b.s.sum-a.s.sum);
    $('#clist',el).innerHTML=list.length?`<div class="tbl-wrap"><table><thead><tr><th>Khách hàng</th><th>SĐT</th><th class="r">Số đơn</th><th class="r">Tổng chi tiêu</th><th>Mua gần nhất</th><th>Đơn kính</th></tr></thead><tbody>${list.map(({c,s})=>`<tr class="click" data-cid="${c.id}"><td><b>${esc(c.name)}</b></td><td class="num">${esc(c.phone)}</td><td class="r num">${s.n}</td><td class="r num"><b>${money(s.sum)}</b></td><td class="num">${s.last?fmtDate(s.last):'—'}</td><td>${c.rx?'<span class="pill good">Có</span>':'<span class="pill neu">Chưa</span>'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Chưa có khách hàng.</div>';
    $$('[data-cid]',el).forEach(r=>r.onclick=()=>customerDetail(cust(r.dataset.cid)));
  };
  $('#cq',el).oninput=e=>{custQ=e.target.value;draw()};
  $('#addC',el).onclick=()=>editCustomer(null,()=>route());
  draw();
}
function customerDetail(c){
  const os=S.orders.filter(o=>o.customerId===c.id).sort((a,b)=>b.date-a.date);
  modal(`<div style="display:flex;justify-content:space-between;gap:10px;align-items:start;flex-wrap:wrap"><div><h2 style="margin:0">${esc(c.name)}</h2><div class="muted num">${esc(c.phone)}${c.note?' · '+esc(c.note):''}</div></div><button class="btn sm" id="editC">Sửa thông tin & đơn kính</button></div>
    <div><div class="small" style="font-weight:600;margin-bottom:6px">Đơn kính gần nhất</div>${c.rx?rxTable(c.rx):'<div class="muted small">Chưa có đơn kính.</div>'}</div>
    <div><div class="small" style="font-weight:600;margin-bottom:6px">Lịch sử mua (${os.length})</div><div class="tbl-wrap">${ordersTable(os)}</div></div>
    <div class="acts"><button class="btn" data-close>Đóng</button></div>`,
  {wide:true,onMount:(m,close)=>{
    $('#editC',m).onclick=()=>{close();editCustomer(c,()=>route())};
    $$('[data-oid]',m).forEach(r=>r.onclick=()=>{close();showReceipt(S.orders.find(o=>o.id===r.dataset.oid))});
  }});
}
function editCustomer(c,after){
  const isNew=!c||!c.id;c=c||{};const rx=c.rx||{od:{sph:'',cyl:'',ax:'',add:''},os:{sph:'',cyl:'',ax:'',add:''},pd:''};
  const cell=(e,k)=>`<td><input data-e="${e}" data-k="${k}" value="${esc(rx[e][k])}" aria-label="${e} ${k}"></td>`;
  modal(`<h2>${isNew?'Thêm khách hàng':'Sửa khách hàng'}</h2>
    <form id="cf" style="display:flex;flex-direction:column;gap:12px">
      <div class="grid2"><label class="f">Họ tên *<input id="c_name" required value="${esc(c.name)}"></label><label class="f">Số điện thoại *<input id="c_phone" required inputmode="tel" value="${esc(c.phone)}"></label></div>
      <label class="f">Ghi chú<input id="c_note" value="${esc(c.note)}" placeholder="VD: dị ứng gọng kim loại"></label>
      <div><div class="small" style="font-weight:600;margin-bottom:6px">Đơn kính (để trống nếu chưa đo)</div>
      <div class="tbl-wrap"><table class="rx num"><thead><tr><th></th><th>SPH</th><th>CYL</th><th>AXIS</th><th>ADD</th></tr></thead><tbody>
        <tr><th>MP (OD)</th>${cell('od','sph')}${cell('od','cyl')}${cell('od','ax')}${cell('od','add')}</tr>
        <tr><th>MT (OS)</th>${cell('os','sph')}${cell('os','cyl')}${cell('os','ax')}${cell('os','add')}</tr>
      </tbody></table></div>
      <label class="f" style="margin-top:8px;max-width:160px">Khoảng cách đồng tử PD (mm)<input id="c_pd" value="${esc(rx.pd)}" inputmode="decimal"></label></div>
      <div class="acts"><button type="button" class="btn" data-close>Thôi</button><button class="btn pri">Lưu</button></div>
    </form>`,{wide:true,onMount:(m,close)=>{
      $('#cf',m).onsubmit=async e=>{e.preventDefault();
        const phone=$('#c_phone',m).value.trim();
        if(S.customers.some(x=>x.id!==c.id&&x.phone===phone)){toast('Số điện thoại này đã có khách hàng');return}
        const nrx={od:{},os:{},pd:$('#c_pd',m).value.trim()};
        $$('[data-e]',m).forEach(i=>nrx[i.dataset.e][i.dataset.k]=i.value.trim());
        const has=[...Object.values(nrx.od),...Object.values(nrx.os),nrx.pd].some(Boolean);
        const item={...c,name:$('#c_name',m).value.trim(),phone,note:$('#c_note',m).value.trim(),rx:has?nrx:null};
        if(isNew){item.id=uid();item.createdAt=Date.now()}
        if(SERVER){try{c=upsert(S.customers,await api('posSave',{kind:'customer',item}))}catch(err){toast(err.message);return}}
        else{Object.assign(c,item);if(isNew)S.customers.push(c);save()}
        close();toast('Đã lưu khách hàng');after&&after(c);
      };
    }});
}

/* ============ Báo cáo ============ */
let repRange=14;
function viewReports(el){
  const D=86400000,oneDay=repRange==='d0'||repRange==='d1';
  const from=repRange==='d0'?startOfDay():repRange==='d1'?startOfDay()-D:startOfDay()-(repRange-1)*D;
  const to=repRange==='d1'?startOfDay():Infinity;
  const inR=o=>o.date>=from&&o.date<to;
  const rangeLb={d0:'Hôm nay',d1:'Hôm qua'}[repRange]||repRange+' ngày qua';
  const os=validOrders().filter(inR);
  const rev=os.reduce((a,o)=>a+o.total,0);
  const cost=os.reduce((a,o)=>a+o.items.reduce((b,i)=>b+(i.cost||0)*i.qty,0),0);
  const disc=os.reduce((a,o)=>a+o.discount,0);
  const days=[];
  if(oneDay){for(let h=0;h<24;h++)days.push({t:from+h*3600000,lb:h+'h',tl:h+'h–'+(h+1)+'h',v:0,n:0});os.forEach(o=>{const d=days[Math.floor((o.date-from)/3600000)];if(d){d.v+=o.total;d.n++}})}
  else{for(let i=0;i<repRange;i++){const t=from+i*D;days.push({t,k:dayKey(t),v:0,n:0})}
    const idx=Object.fromEntries(days.map((d,i)=>[d.k,i]));
    os.forEach(o=>{const i=idx[dayKey(o.date)];if(i!=null){days[i].v+=o.total;days[i].n++}})}
  const prodMap={};os.forEach(o=>o.items.forEach(i=>{const k=i.pid;prodMap[k]=prodMap[k]||{name:i.name,qty:0,rev:0};prodMap[k].qty+=i.qty;prodMap[k].rev+=i.qty*i.price}));
  const top=Object.values(prodMap).sort((a,b)=>b.rev-a.rev).slice(0,6);
  const catMap={};os.forEach(o=>o.items.forEach(i=>{const p=prod(i.pid);const c=p?p.cat:'Khác';catMap[c]=(catMap[c]||0)+i.qty*i.price}));
  const cats=Object.entries(catMap).sort((a,b)=>b[1]-a[1]);
  const methMap={};os.forEach(o=>methMap[o.method]=(methMap[o.method]||0)+o.total);
  const chMap={};os.forEach(o=>{const k=CHANNELS[o.channel||'pos'];chMap[k]=(chMap[k]||0)+o.total});
  const oCost=o=>o.items.reduce((b,i)=>b+(i.cost||0)*i.qty,0);
  const stMap={};os.forEach(o=>{const k=o.staffId||o.staffName||'_';const x=stMap[k]=stMap[k]||{name:o.staffName||(SERVER?'Chưa rõ':'Máy này'),n:0,rev:0,gp:0};x.n++;x.rev+=o.total;x.gp+=o.total-oCost(o)});
  const staffRows=Object.values(stMap).sort((a,b)=>b.rev-a.rev);
  const allOs=S.orders.filter(o=>o.status==='done'&&inR(o));
  const brMap={};allOs.forEach(o=>{const k=o.branchId||firstBr();const x=brMap[k]=brMap[k]||{id:k,n:0,rev:0,gp:0};x.n++;x.rev+=o.total;x.gp+=o.total-oCost(o)});
  const brRows=Object.values(brMap).sort((a,b)=>b.rev-a.rev),brTotal=brRows.reduce((a,x)=>a+x.rev,0);
  const ctvMap={};os.filter(o=>o.ctvId).forEach(o=>{const x=ctvMap[o.ctvId]=ctvMap[o.ctvId]||{n:0,rev:0,com:0};x.n++;x.rev+=o.total;x.com+=o.commission||0});
  el.innerHTML=`<div class="head"><h1>Báo cáo doanh thu${CUR_BR&&CUR_BR!=='all'?' · '+esc(brName(CUR_BR)):''}</h1><span class="grow"></span><div class="chips" id="rr">${[['d0','Hôm nay'],['d1','Hôm qua'],[7,'7 ngày'],[14,'14 ngày'],[30,'30 ngày']].map(([v,l])=>`<button class="chip${v===repRange?' on':''}" data-v="${v}">${l}</button>`).join('')}</div></div>
  <div class="stats">
    <div class="card stat"><div class="lb">Doanh thu thuần</div><div class="v num">${money(rev)}</div><div class="d muted">${os.length} đơn hoàn thành</div></div>
    <div class="card stat"><div class="lb">Lợi nhuận gộp</div><div class="v num" style="color:var(--good)">${money(rev-cost)}</div><div class="d muted">Biên ${rev?Math.round((rev-cost)/rev*100):0}%</div></div>
    <div class="card stat"><div class="lb">Giảm giá đã áp</div><div class="v num">${money(disc)}</div><div class="d muted">Trên ${os.filter(o=>o.discount).length} đơn</div></div>
    <div class="card stat"><div class="lb">Giá trị TB / đơn</div><div class="v num">${money(os.length?rev/os.length:0)}</div><div class="d muted">${rangeLb}</div></div>
  </div>
  <div class="two">
    <div class="card chart"><h2>Doanh thu theo ${oneDay?'giờ · '+rangeLb.toLowerCase():'ngày'}</h2>${barChart(days)}</div>
    <div class="card"><h2>Theo phương thức thanh toán</h2>${barList(Object.entries(methMap).map(([k,v])=>[METHODS[k],v]),rev)}</div>
  </div>
  <div class="two" style="margin-top:16px">
    <div class="card"><h2>Sản phẩm bán chạy</h2>${top.length?`<div class="tbl-wrap"><table><thead><tr><th>Sản phẩm</th><th class="r">SL</th><th class="r">Doanh thu</th></tr></thead><tbody>${top.map(t=>`<tr><td>${esc(t.name)}</td><td class="r num">${t.qty}</td><td class="r num"><b>${money(t.rev)}</b></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Chưa có dữ liệu.</div>'}</div>
    <div class="card"><h2>Theo nhóm hàng</h2>${barList(cats,cats.reduce((a,c)=>a+c[1],0))}</div>
  </div>

function barList(rows,total){
  if(!rows.length)return '<div class="empty">Chưa có dữ liệu.</div>';
  const max=Math.max(...rows.map(r=>r[1]));
  return `<div class="bar-list">${rows.map(([k,v])=>`<div class="row"><span>${esc(k)}</span><span class="num"><b>${money(v)}</b> <span class="muted">${total?Math.round(v/total*100):0}%</span></span><div class="track"><div class="fill" style="width:${max?v/max*100:0}%"></div></div></div>`).join('')}</div>`;
}
function barChart(days){
  const W=640,H=240,L=58,B=26,T=10,R=8;const max=Math.max(1,...days.map(d=>d.v));
  const step=niceStep(max/4);const top=Math.ceil(max/step)*step;
  const y=v=>T+(H-T-B)*(1-v/top);const bw=(W-L-R)/days.length;
  let g='';for(let v=0;v<=top;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${short(v)}</text>`}
  const every=Math.ceil(days.length/10);
  const bars=days.map((d,i)=>{const x=L+i*bw+bw*.18,w=bw*.64,h=y(0)-y(d.v);const last=i===days.length-1;
    return `<rect x="${x}" y="${y(d.v)}" width="${w}" height="${Math.max(0,h)}" rx="2" fill="var(--accent)" opacity="${last?1:.72}"><title>${d.tl||fmtDate(d.t)}: ${money(d.v)} (${d.n} đơn)</title></rect>${i%every===0||last?`<text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${d.lb||new Date(d.t).getDate()+'/'+(new Date(d.t).getMonth()+1)}</text>`:''}`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ doanh thu theo ngày">${g}${bars}</svg>`;
}
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x||1)));const f=x/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function short(v){return v>=1e6?(v/1e6).toLocaleString('vi-VN',{maximumFractionDigits:1})+'tr':v>=1e3?(v/1e3)+'k':String(v)}

function normPhone(p){p=String(p||'').replace(/[^\d+]/g,'');if(p.startsWith('+84'))p='0'+p.slice(3);else if(p.startsWith('84')&&p.length===11)p='0'+p.slice(2);return p}
function findProductsIn(text){
  const t=norm(text);const found=[];
  const sorted=[...S.products].sort((a,b)=>b.name.length-a.name.length);
  const used=[];
  for(const p of sorted){
    for(const key of [norm(p.sku),norm(p.name),norm(p.name.replace(/\s*\([^)]*\)\s*/g,' ')).trim()]){
      if(!key)continue;const at=t.indexOf(key);
      if(at<0||used.some(([a,b])=>at<b&&at+key.length>a))continue;
      used.push([at,at+key.length]);
      const after=t.slice(at+key.length,at+key.length+16).match(/^\s*[,:-]?\s*(?:x|sl|so luong)?\s*:?\s*(\d{1,2})\b/);
      const before=t.slice(Math.max(0,at-12),at).match(/(\d{1,2})\s*(?:cai|chiec|cap|hop|x)?\s*$/);
      found.push({p,qty:Number((after&&after[1])||(before&&before[1])||1)});break;
    }
  }
  return found;
}
function parseMessage(txt){
  const lines=txt.split(/\n+/).map(l=>l.trim()).filter(Boolean);
  const pm=txt.match(/(?:\+?84|0)(?:[\s.\-]?\d){9}/);
  const field=re=>{for(const l of lines){const m=l.match(re);if(m&&m[1].trim())return m[1].trim()}return ''};
  let name=field(/^(?:họ\s*tên|tên|ten|người nhận|nguoi nhan|khách|khach)\s*[:\-]\s*(.+)$/i);
  let address=field(/^(?:địa chỉ|dia chi|đ\/c|d\/c|đc|dc|giao (?:đến|tới|về))\s*[:\-]?\s*(.+)$/i);
  if(!address){const l=lines.find(l=>/(phường|quận|huyện|xã|thị trấn|tỉnh|tp\.?\s|thành phố|đường|\bp\.\s?\d|\bq\.\s?\d)/i.test(l));if(l)address=l.replace(/^[^:]*:\s*/,'')}
  const ship=field(/^(?:phí ship|phi ship|ship|phí giao)\s*[:\-]?\s*(.+)$/i);
  return {name,phone:pm?normPhone(pm[0]):'',address,items:findProductsIn(txt),shipFee:ship?parseNum(ship)*(/k\b/i.test(ship)&&parseNum(ship)<1000?1000:1):0};
}

const SHEET_COLS={
  code:['ma don','ma dh','order id','id don','so don'],
  date:['ngay','ngay dat','thoi gian','timestamp','dau thoi gian'],
  ctv:['ctv','cong tac vien','nguoi ban','ten ctv','ma ctv'],
  name:['ten khach','ho ten','khach hang','ten','nguoi nhan','ten nguoi nhan'],
  phone:['sdt','so dien thoai','dien thoai','phone','sdt khach'],
  address:['dia chi','dia chi giao','dia chi nhan'],
  product:['san pham','ma sp','sku','ten san pham','hang','mat hang'],
  qty:['so luong','sl','qty'],
  price:['gia','don gia','gia ban'],
  ship:['phi ship','phi giao','ship','phi van chuyen'],
  note:['ghi chu','note'],
};
function parseSheet(txt){
  const rows=txt.replace(/\r/g,'').split('\n').filter(l=>l.trim()).map(l=>l.includes('\t')?l.split('\t'):splitCSV(l));
  if(rows.length<2)return {err:'Cần ít nhất dòng tiêu đề và một dòng đơn.'};
  const head=rows[0].map(h=>norm(h).trim());const map={};
  for(const [k,names] of Object.entries(SHEET_COLS)){const i=head.findIndex(h=>names.includes(h));if(i<0){const j=head.findIndex(h=>names.some(n=>n.length>3&&h.includes(n)));if(j>=0)map[k]=j}else map[k]=i}
  if(map.phone==null||map.product==null)return {err:'Không thấy cột Số điện thoại hoặc Sản phẩm trong dòng tiêu đề.',head:rows[0]};
  const groups=new Map();
  rows.slice(1).forEach((r,ix)=>{
    const g=k=>map[k]!=null?(r[map[k]]||'').trim():'';
    const code=g('code')||('dong-'+(ix+2)+'-'+normPhone(g('phone')));
    if(!groups.has(code))groups.set(code,{code,ext:!!g('code'),row:ix+2,ctv:g('ctv'),name:g('name'),phone:normPhone(g('phone')),address:g('address'),ship:parseNum(g('ship')),note:g('note'),date:g('date'),lines:[],errs:[]});
    const o=groups.get(code);
    const pq=g('product');const hit=findProductsIn(pq)[0];
    const qty=parseNum(g('qty'))||(hit?hit.qty:1);
    if(!pq)return;
    if(!hit)o.errs.push(`Không tìm thấy sản phẩm "${pq}"`);
    else o.lines.push({p:hit.p,qty,price:parseNum(g('price'))||hit.p.price});
  });
  const list=[...groups.values()];
  list.forEach(o=>{
    if(!o.phone)o.errs.push('Thiếu số điện thoại');
    if(o.ext&&S.orders.some(x=>x.extCode===o.code))o.dup=true;
    if(!o.lines.length&&!o.errs.length)o.errs.push('Không có sản phẩm');
  });
  return {list,map};
}
function splitCSV(l){const out=[];let cur='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(q){if(ch==='"'&&l[i+1]==='"'){cur+='"';i++}else if(ch==='"')q=false;else cur+=ch}else if(ch==='"')q=true;else if(ch===','){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out}

        items.forEach(i=>{const p=prod(i.pid);if(p&&!p.service){if(p.stock<i.qty)short.push(p.name);adjStock(p,-i.qty,o.branchId);S.stockLog.push({id:uid(),date:o.date,pid:p.id,qty:-i.qty,type:'ban',note:o.code})}});
        S.orders.push(o);n++;
      });
      save();close();ordFilter={q:'',range:'all',status:'pending',ch:'ctv'};

      toast(`Đã nhập ${n} đơn cộng tác viên`+(short.length?'. Tồn kho âm: '+[...new Set(short)].join(', '):''));
    };
  }});
}

async function api(action,data){
  let j;
  try{const res=await fetch(window.POS_API||window.CTV_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,token:tok()},data||{}))});j=await res.json()}
  catch(e){throw new Error('Mất kết nối máy chủ, vui lòng thử lại')}
  if(!j.ok){const e=new Error(j.error||'Có lỗi xảy ra');if(/đăng nhập lại/.test(j.error||'')&&action!=='posLogin'){setTok('');ME=null;setTimeout(()=>showLogin(j.error),0)}throw e}

async function pollNotices(){

      if(ctv){o.ctvId=ctv.id;o.commission=Math.round(sub*ctv.rate/100)}
      const d=await api('posCreateOrder',{order:o,allowNegative:true});
      if(d.duplicate){dup++;continue}
      S.orders.push(d.order);seenOrders&&seenOrders.add(d.order.id);mergeProducts(d.products);n++;
    }catch(e){errs.push((g.ext?g.code:'dòng '+g.row)+': '+e.message)}
  }
  close();ordFilter={q:'',range:'all',status:'pending',ch:'ctv'};
  if(location.hash!=='#don-hang')location.hash='don-hang';else route();
  toast(`Đã nhập ${n} đơn cộng tác viên`+(dup?`, bỏ qua ${dup} đơn đã có`:'')+(errs.length?`. Lỗi: ${errs.join('; ')}`:''));
}

const THU_CATS=['Bán hàng','Thu nợ khách','Thu chiết khấu nhà cung cấp','Góp vốn','Thu khác'];

function cashLocal(e){
  S.cash=S.cash||[];S.cashSeq=S.cashSeq||{thu:0,chi:0};
  const n=++S.cashSeq[e.type];
  const row={id:uid(),code:(e.type==='thu'?'PT':'PC')+String(n).padStart(5,'0'),date:e.date||Date.now(),type:e.type,fund:e.fund,category:e.category,amount:Math.round(e.amount),note:e.note||'',ref:e.ref||'',staff:e.staff||'',branch:e.branch||'',status:'ok',auto:!!e.auto};

}
function cashForOrderLocal(o,ev){
  if(ev==='done')cashLocal({type:'thu',fund:fundForMethod(o.method),category:'Bán hàng',amount:o.total,note:'Thu tiền đơn '+o.code,ref:o.code,auto:true,branch:o.branchId});
  if(ev==='refund')cashLocal({type:'chi',fund:fundForMethod(o.method),category:'Hoàn tiền khách',amount:o.total,note:'Hoàn tiền đơn hủy '+o.code,ref:o.code,auto:true,branch:o.branchId});

function cashFrom(){
  if(cashRange==='all')return 0;
  if(cashRange==='thang'){const d=new Date();d.setDate(1);d.setHours(0,0,0,0);return d.getTime()}
  return startOfDay()-(Number(cashRange)-1)*86400000;
}

  const rev=os.reduce((a,o)=>a+o.total-(o.shipFee||0),0),cogs=os.reduce((a,o)=>a+o.items.reduce((b,i)=>b+(i.cost||0)*i.qty,0),0);
  const opex=live.filter(e=>inBr(e)&&e.date>=from&&e.type==='chi'&&!NOT_EXPENSE.includes(e.category)).reduce((a,e)=>a+e.amount,0);
  const q=norm(cashQ);

    <input id="cfQ" placeholder="Tìm mã phiếu, nội dung" value="${esc(cashQ)}">
  </div></div>
  <div class="stats">
    <div class="card stat"><div class="lb">Tồn đầu kỳ</div><div class="v num">${money(before)}</div></div>
    <div class="card stat"><div class="lb">Tổng thu</div><div class="v num" style="color:var(--good)">+${money(thu)}</div><div class="d muted">${per.filter(e=>e.type==='thu').length} phiếu</div></div>
    <div class="card stat"><div class="lb">Tổng chi</div><div class="v num" style="color:var(--bad)">−${money(chi)}</div><div class="d muted">${per.filter(e=>e.type==='chi').length} phiếu</div></div>
    <div class="card stat"><div class="lb">Tồn cuối kỳ</div><div class="v num">${money(after)}</div><div class="d muted">${cashFund==='all'?'Tất cả quỹ':esc(fundName(cashFund))}</div></div>
  </div>
  <div class="two">

/* ============ Lấy sản phẩm từ trang web eyemedi.vn ============ */
const WEB_CAT={'Gọng kính cận':'Gọng kính','Kính thời trang':'Kính thời trang','Tròng kính mắt':'Tròng kính','Kính áp tròng':'Kính áp tròng','Phụ kiện mắt kính':'Phụ kiện','Thiết bị ngành mắt kính':'Thiết bị'};
async function fetchWebProducts(){
  const r=await fetch('/index.html?t='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw new Error('Không tải được trang web ('+r.status+')');
  const s=await r.text(),k='const PRODUCTS = ',i=s.indexOf(k);
  if(i<0)throw new Error('Không tìm thấy danh sách sản phẩm trên trang web');
  let line=s.slice(i+k.length,s.indexOf('\n',i)>0?s.indexOf('\n',i):s.length).trim();
  if(line.endsWith(';'))line=line.slice(0,-1);
  const P=JSON.parse(line);
  if(!Array.isArray(P)||!P.length)throw new Error('Danh sách sản phẩm trên web đang trống');
  return P;
}
function webItems(P,split){
  const used=new Set(),out=[];
  P.forEach(p=>{
    if(!p||!p.id||!p.name)return;
    const cat=WEB_CAT[p.category]||'Phụ kiện',lens=cat==='Tròng kính',price=Number(p.price)||0;
    let base=String(p.code||p.id).trim().replace(/\s+/g,'');
    if(!base||used.has(base.toLowerCase()))base=String(p.id).toUpperCase();
    used.add(base.toLowerCase());
    const vs=[1,2,3,4,5,6,7,8].map(n=>p['variant'+n]?{n:String(p['variant'+n]).trim(),pr:Number(p['variant'+n+'Price'])||price}:null).filter(Boolean);
    const mk=(sku,name,pr,wid)=>({id:'web-'+wid.replace(/[^\w-]/g,'-'),webId:wid,sku,name,cat,brand:p.brand||'',price:pr,cost:0,stock:0,barcode:'',service:false,
      ...(lens?{pricePending:true,keepPrice:true}:{})});
    if(split&&vs.length>1)vs.forEach((v,n)=>out.push(mk(base+'-'+(n+1),p.name+' – '+v.n,v.pr,p.id+'#'+(n+1))));
    else out.push(mk(base,p.name,price,p.id));
  });
  return out;
}
/* So với danh sách hiện có: thêm mới / cập nhật / giữ nguyên */
function webPlan(items){
  const byWeb={},bySku={};S.products.forEach(p=>{if(p.webId)byWeb[p.webId]=p;bySku[String(p.sku).toLowerCase()]=p});
  const plan={add:[],upd:[],same:[]};
  items.forEach(it=>{
    const p=byWeb[it.webId]||bySku[it.sku.toLowerCase()];
    if(!p){plan.add.push(it);return}
    const keep=it.keepPrice&&p.price>0&&!p.pricePending;
    const newPrice=keep?p.price:it.price;
    (p.name!==it.name||p.cat!==it.cat||p.price!==newPrice||(p.brand||'')!==it.brand||p.webId!==it.webId?plan.upd:plan.same).push({it,p,newPrice,keep});
  });
  return plan;
}
function webApplyLocal(plan){
  plan.add.forEach(it=>{const o={...it,stocks:{}};delete o.keepPrice;S.products.push(o)});
  plan.upd.forEach(({it,p,newPrice,keep})=>{Object.assign(p,{webId:it.webId,name:it.name,cat:it.cat,brand:it.brand,price:newPrice});if(!keep&&it.pricePending)p.pricePending=true});
  applyStockView();save();
}
async function importWebForm(){
  if(!can('san_pham')){toast('Bạn chưa được cấp quyền sửa sản phẩm');return}
  let P;
  toast('Đang tải danh sách sản phẩm từ trang web…');
  try{P=await fetchWebProducts()}catch(err){toast(err.message);return}
  let split=true;
  modal(`<h2>Lấy sản phẩm từ trang web</h2><div id="wi_body"></div>
    <label class="chk"><input type="checkbox" id="wi_split" checked> Tách mỗi màu / phiên bản thành một mã riêng (để quản lý tồn kho từng màu)</label>
    <div class="acts"><button class="btn" data-close>Thôi</button><button class="btn pri" id="wi_ok">Nhập vào phần mềm</button></div>`,
  {wide:true,onMount:(m,close)=>{
    let items,plan;
    const draw=()=>{
      items=webItems(P,split);plan=webPlan(items);
      const cats={};items.forEach(it=>{cats[it.cat]=(cats[it.cat]||0)+1});
      const lens=items.filter(it=>it.pricePending).length-[...plan.upd,...plan.same].filter(u=>u.keep).length;
      $('#wi_body',m).innerHTML=`<div class="small muted" style="margin-bottom:10px">Trang web đang có <b>${P.length}</b> sản phẩm, tạo thành <b>${items.length}</b> mã hàng với giá bán đang hiển thị trên web. Giá vốn và tồn kho để trống, nhập sau ở Kho hàng.</div>
        <div class="stats" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:12px">
          <div class="card stat"><div class="lb">Thêm mới</div><div class="v num">${plan.add.length}</div></div>
          <div class="card stat"><div class="lb">Cập nhật giá, tên</div><div class="v num">${plan.upd.length}</div></div>
          <div class="card stat"><div class="lb">Đã đúng, giữ nguyên</div><div class="v num">${plan.same.length}</div></div></div>
        <div class="tbl-wrap"><table><thead><tr><th>Nhóm hàng</th><th class="r">Số mã</th></tr></thead><tbody>${Object.keys(cats).map(c=>`<tr><td>${esc(c)}${c==='Tròng kính'?' <span class="pill warn">Chờ bảng giá</span>':''}</td><td class="r num">${cats[c]}</td></tr>`).join('')}</tbody></table></div>
        ${lens?`<div class="small muted" style="margin-top:10px">${lens} mã tròng kính tạm lấy giá web và gắn nhãn “Chờ bảng giá”. Khi sửa giá một tròng kính, nhãn tự bỏ và lần lấy giá web sau sẽ không ghi đè giá đó.</div>`:''}
        ${plan.upd.length?`<details style="margin-top:10px"><summary class="small">Xem ${plan.upd.length} mã sẽ cập nhật</summary><div class="tbl-wrap"><table><tbody>${plan.upd.map(u=>`<tr><td>${esc(u.it.sku)} · ${esc(u.it.name)}</td><td class="r num">${u.p.price!==u.newPrice?money(u.p.price)+' → '+money(u.newPrice):'giữ giá '+money(u.p.price)}</td></tr>`).join('')}</tbody></table></div></details>`:''}`;
      $('#wi_ok',m).disabled=!plan.add.length&&!plan.upd.length;
    };
    $('#wi_split',m).onchange=e=>{split=e.target.checked;draw()};
    $('#wi_ok',m).onclick=async()=>{
      const b=$('#wi_ok',m),n1=plan.add.length,n2=plan.upd.length;
      if(SERVER){b.disabled=true;b.textContent='Đang nhập…';
        try{const res=await api('posImportProducts',{items:[...plan.add,...plan.upd.map(u=>u.it)]});S.products=res.products;applyStockView();
          close();route();toast(`Đã thêm ${res.added} và cập nhật ${res.updated} sản phẩm`)}
        catch(err){toast(/Yêu cầu không hợp lệ/.test(err.message)?'Máy chủ chưa có chức năng này, vui lòng cập nhật Apps Script theo hướng dẫn':err.message);b.disabled=false;b.textContent='Nhập vào phần mềm'}
        return}
      webApplyLocal(plan);close();route();toast(`Đã thêm ${n1} và cập nhật ${n2} sản phẩm`);
    };
    draw();
  }});
}
/* ============ Cài lên màn hình điện thoại ============ */
let INSTALL_EVT=null;
const isStandalone=()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}};
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function installBtn(){return isStandalone()?'':'<button class="btn sm" data-install>Cài lên điện thoại</button>'}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();INSTALL_EVT=e});
window.addEventListener('appinstalled',()=>{INSTALL_EVT=null;$$('[data-install]').forEach(b=>b.remove());toast('Đã cài Eyemedi lên màn hình chính')});
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('[data-install]'))installApp()});
async function installApp(){
  if(INSTALL_EVT){const ev=INSTALL_EVT;INSTALL_EVT=null;try{await ev.prompt();const r=await ev.userChoice;if(r&&r.outcome==='accepted')return}catch(e){}}
  const ios=isIOS(),inApp=/FBAN|FBAV|Zalo|Instagram|Line\//i.test(navigator.userAgent);
  const step=(n,t)=>`<div style="display:flex;gap:10px;align-items:flex-start"><span class="pill neu" style="min-width:24px;text-align:center">${n}</span><div>${t}</div></div>`;
  modal(`<h2>Cài Eyemedi lên màn hình chính</h2>
    <div style="display:flex;gap:12px;align-items:center"><img src="/app/icon-192.png" alt="" width="56" height="56" style="border-radius:12px;border:1px solid var(--line)"><div class="small muted">Cài xong, biểu tượng Eyemedi nằm trên màn hình điện thoại, mở lên dùng toàn màn hình như một ứng dụng. Tài khoản và dữ liệu vẫn như trên web.</div></div>
    ${inApp?`<div class="banner" style="margin:0">Bạn đang mở trong Facebook hoặc Zalo. Hãy bấm nút ⋯ ở góc trên, chọn <b>Mở bằng trình duyệt</b> (Safari trên iPhone, Chrome trên Android) rồi làm theo hướng dẫn dưới đây.</div>`:''}
    ${ios?`<h3 style="margin:4px 0 0">iPhone, iPad (Safari)</h3>
      ${step(1,'Mở <b>eyemedi.vn/app</b> bằng <b>Safari</b>.')}
      ${step(2,'Bấm nút <b>Chia sẻ</b> (ô vuông có mũi tên đi lên) ở thanh dưới cùng hoặc trên cùng.')}
      ${step(3,'Kéo xuống, chọn <b>Thêm vào MH chính</b> (Add to Home Screen), rồi bấm <b>Thêm</b>.')}`
    :`<h3 style="margin:4px 0 0">Điện thoại Android (Chrome)</h3>
      ${step(1,'Mở <b>eyemedi.vn/app</b> bằng <b>Chrome</b>.')}
      ${step(2,'Bấm nút <b>⋮</b> ở góc trên bên phải.')}
      ${step(3,'Chọn <b>Cài đặt ứng dụng</b> hoặc <b>Thêm vào màn hình chính</b>, rồi bấm <b>Cài đặt</b>.')}
      <div class="small muted">iPhone: mở bằng Safari, bấm nút Chia sẻ rồi chọn Thêm vào MH chính. Máy tính: bấm biểu tượng cài đặt ở cuối thanh địa chỉ Chrome hoặc Edge.</div>`}
    <div class="acts"><button class="btn pri" data-close>Đã hiểu</button></div>`);
}
if('serviceWorker' in navigator&&window.isSecureContext)window.addEventListener('load',()=>navigator.serviceWorker.register('/app/sw.js',{scope:'/app/'}).catch(()=>{}));
/* ============ Khởi động ============ */
document.addEventListener('keydown',e=>{
  if(e.key==='F3'){e.preventDefault();if(location.hash!=='#ban-hang')location.hash='ban-hang';setTimeout(()=>$('#posQ')&&$('#posQ').focus(),0)}
  if(e.key==='F9'&&$('#checkout')&&!$('.ov')){e.preventDefault();checkout()}

boot();
