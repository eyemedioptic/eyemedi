<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quản trị cộng tác viên | EYEMEDI</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.ico">
<link rel="manifest" href="/ctv/manifest.webmanifest">
<meta name="theme-color" content="#0b5558">
<link rel="apple-touch-icon" href="/ctv/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EYEMEDI CTV">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="ctv.css">
<style>main{max-width:1200px}.tbl td .btn{margin:2px 2px 2px 0}.tbl select,.tbl input{padding:6px 8px;font-size:13px;width:auto}
.bell{position:relative;background:none;border:1px solid var(--line);border-radius:50%;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:#0b5558;padding:0}
.bell svg{width:21px;height:21px}.bell.ring svg{animation:ring 1.2s ease 2}
@keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(16deg)}30%{transform:rotate(-14deg)}45%{transform:rotate(9deg)}60%{transform:rotate(-6deg)}}
.bell .bd{position:absolute;top:-5px;right:-6px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#e0322f;color:#fff;font:700 11px/19px Arial,sans-serif;text-align:center;box-shadow:0 0 0 2px #fff}
.np{position:fixed;top:60px;right:12px;width:min(380px,calc(100vw - 24px));max-height:calc(100vh - 80px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.18);z-index:20}
.np h3{margin:0;padding:14px 16px 8px;font-size:16px;display:flex;align-items:center}.np h3 span{flex:1}.np h3 a{font-size:12px;font-weight:400;cursor:pointer}
.np .todo{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px;border-bottom:1px solid var(--line)}
.np .todo button{border:0;border-radius:16px;padding:5px 10px;font-size:12px;background:#fff4e0;color:#8a5300;cursor:pointer}.np .todo button.z{background:#f1f5f5;color:#678}
.np .it{display:flex;gap:10px;padding:10px 16px;border-bottom:1px solid #eef3f3;cursor:pointer;font-size:14px;line-height:1.35}.np .it:hover{background:#f5fafa}
.np .it.un{background:#eef8f8}.np .it.un .ic{position:relative}.np .it.un .ic::after{content:'';position:absolute;top:0;right:-1px;width:9px;height:9px;border-radius:50%;background:#e0322f;box-shadow:0 0 0 2px #eef8f8}
.np .ic{flex:0 0 32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;background:#e6f2f2}
.np .t{flex:1}.np .t small{display:block;color:#789;margin-top:2px}.np .empty{padding:20px 16px;color:#789;font-size:14px}
#tabs button .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:#e0322f;color:#fff;font-size:11px;line-height:18px}</style>
</head>
<body>
<header class="top"><a href="/"><img src="/images/logo-eyemedi.png" alt="EYEMEDI"></a><b>Quản trị CTV</b><span class="sp"></span>
  <button class="bell" id="bell" title="Thông báo" aria-label="Thông báo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="bd hide" id="bd"></span></button>
  <a class="btn ghost sm" href="app.html">Trang CTV</a><button class="btn ghost sm" id="rf">Tải lại</button></header>
<div class="np hide" id="np"></div>
<main>
  <div id="load" class="card muted">Đang tải…</div>
  <div id="ad" class="hide">
    <div class="stats card" id="stats"></div>
    <div class="tabs" id="tabs"></div>
    <div id="mAd" class="msg"></div>
    <div class="card"><div class="copy" style="margin-bottom:12px"><input id="q" placeholder="Tìm theo tên, SĐT, mã CTV, mã đơn…"><select id="fs" style="width:auto"></select></div>
      <div class="scroll"><table class="tbl" id="tb"></table></div></div>
  </div>
</main>
<script src="config.js"></script>
<script src="api.js"></script>
<script src="/ctv/pwa.js"></script>
<script>
if(!CTV.token())location.replace('index.html#dang-nhap');
var E=CTV.esc,$=function(id){return document.getElementById(id)},D=null,TAB='ctv';
var TABS={ctv:'Cộng tác viên',samples:'Đơn mẫu',videos:'Video',orders:'Đơn hàng',pay:'Đối soát hoa hồng',contracts:'Hợp đồng'};
var SAMPLE={new:['Mới','warn'],confirmed:['Đã xác nhận','warn'],shipping:['Đang giao','warn'],delivered:['Đã nhận','ok'],cancelled:['Hủy','bad']};
var VID={pending:['Chờ duyệt','warn'],approved:['Đạt','ok'],rejected:['Không đạt','bad']};

function load(quiet){return CTV.call('adminData').then(function(d){D=d;$('load').classList.add('hide');$('ad').classList.remove('hide');
    var busy=quiet&&document.activeElement&&$('tb').contains(document.activeElement);if(!busy)render();notify(quiet)})
  .catch(function(e){if(!quiet)$('load').textContent=e.message})}
/* ===== Thông báo ===== */
var SEEN_KEY='eyemedi_admin_seen',PREV=-1;
function seen(){try{return localStorage.getItem(SEEN_KEY)||''}catch(e){return ''}}
function events(){var ev=[],u;
  D.ctv.forEach(function(x){if(x.is_admin!=='TRUE')ev.push({t:x.created_at,ic:'👤',tab:'ctv',q:x.phone,h:'<b>'+E(x.full_name)+'</b> đăng ký làm '+E(x.kind||'CTV'),s:x.status==='pending'?'Chờ duyệt':''})});
  D.contracts.forEach(function(c){ev.push({t:c.signed_at,ic:'✍️',tab:'contracts',q:c.ref_code,h:'<b>'+E(byId(c.ctv_id).full_name||c.full_name)+'</b> đã ký hợp đồng'})});
  D.samples.forEach(function(x){ev.push({t:x.created_at,ic:'🎁',tab:'samples',q:x.id,h:'<b>'+E(byId(x.ctv_id).full_name)+'</b> đặt mẫu: '+E(x.product_name),s:x.status==='new'?'Cần xác nhận':''})});
  D.videos.forEach(function(x){ev.push({t:x.created_at,ic:'🎬',tab:'videos',q:x.ref_code,h:'<b>'+E(byId(x.ctv_id).full_name)+'</b> gửi video chờ duyệt',s:x.status==='pending'?'Chờ duyệt':''})});
  D.orders.forEach(function(x){ev.push({t:x.created_at,ic:'🛒',tab:'orders',q:x.order_code,h:'Đơn <b>'+E(x.order_code)+'</b> từ CTV <b>'+E((byId(x.ctv_id).full_name)||x.ref_code)+'</b> · '+CTV.money(x.total),s:x.status==='new'?'Đơn mới':''})});
  return ev.filter(function(e){return e.t}).sort(function(a,b){return a.t<b.t?1:-1})}
function todo(){var c=function(a,f){return a.filter(f).length};
  return [['ctv','pending','CTV chờ duyệt',c(D.ctv,function(u){return u.status==='pending'})],['samples','new','Đơn mẫu mới',c(D.samples,function(s){return s.status==='new'})],
    ['videos','pending','Video chờ duyệt',c(D.videos,function(v){return v.status==='pending'})],['orders','new','Đơn hàng mới',c(D.orders,function(o){return o.status==='new'})]]}
function notify(quiet){var s=seen(),ev=events(),un=ev.filter(function(e){return e.t>s}).length;
  $('bd').textContent=un>99?'99+':un;$('bd').classList.toggle('hide',!un);
  document.title=(un?'('+un+') ':'')+'Quản trị cộng tác viên | EYEMEDI';
  if(quiet&&PREV>=0&&un>PREV){$('bell').classList.remove('ring');void $('bell').offsetWidth;$('bell').classList.add('ring')}
  PREV=un;if(!$('np').classList.contains('hide'))panel()}
function panel(){var s=seen(),ev=events().slice(0,40);
  $('np').innerHTML='<h3><span>Thông báo</span><a id="nAll">Đánh dấu đã xem</a></h3><div class="todo">'+
    todo().map(function(t){return '<button data-t="'+t[0]+'" data-f="'+t[1]+'"'+(t[3]?'':' class="z"')+'>'+t[2]+': <b>'+t[3]+'</b></button>'}).join('')+'</div>'+
    (ev.length?ev.map(function(e,i){return '<div class="it'+(e.t>s?' un':'')+'" data-i="'+i+'"><div class="ic">'+e.ic+'</div><div class="t">'+e.h+'<small>'+E(e.t)+(e.s?' · <b style="color:#b26a00">'+e.s+'</b>':'')+'</small></div></div>'}).join(''):'<div class="empty">Chưa có thông báo.</div>');
  $('nAll').onclick=markSeen;
  $('np').querySelectorAll('.todo button').forEach(function(b){b.onclick=function(){go(b.dataset.t,'',b.dataset.f)}});
  $('np').querySelectorAll('.it').forEach(function(d){d.onclick=function(){var e=ev[+d.dataset.i];go(e.tab,e.q||'','')}})}
function markSeen(){var ev=events();try{localStorage.setItem(SEEN_KEY,ev.length?ev[0].t:'')}catch(e){}PREV=0;notify();panel()}
function go(tab,q,f){TAB=tab;$('fs').dataset.t='';$('q').value=q;render();$('fs').value=f;render();closeNp()}
function closeNp(){if($('np').classList.contains('hide'))return;$('np').classList.add('hide');markSeen()}
$('bell').onclick=function(e){e.stopPropagation();if(!D)return;var h=$('np').classList.contains('hide');if(h){panel();$('np').classList.remove('hide')}else closeNp()};
document.addEventListener('click',function(e){if(!$('np').contains(e.target)&&e.target!==$('bell'))closeNp()});
setInterval(function(){if(!document.hidden&&D)load(true)},60000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&D)load(true)});
$('rf').onclick=load;$('q').oninput=render;$('fs').onchange=render;
function byId(id){return D.ctv.filter(function(u){return u.id===id})[0]||{}}
function name(id){var u=byId(id);return '<b>'+E(u.full_name||'?')+'</b><br><span class="small muted">'+E(u.ref_code||'')+' · '+E(u.phone||'')+'</span>'}
function hit(o){var q=$('q').value.trim().toLowerCase();if(!q)return true;var u=byId(o.ctv_id||o.id);return JSON.stringify(o).toLowerCase().indexOf(q)>=0||JSON.stringify(u).toLowerCase().indexOf(q)>=0}

function render(){
  var c=function(a,f){return a.filter(f).length};
  $('stats').innerHTML=[['Chờ duyệt CTV',c(D.ctv,function(u){return u.status==='pending'})],['Đơn mẫu mới',c(D.samples,function(s){return s.status==='new'})],
    ['Video chờ duyệt',c(D.videos,function(v){return v.status==='pending'})],['CTV hoạt động',c(D.ctv,function(u){return u.status==='active'})]]
    .map(function(s){return '<div class="stat"><div class="k">'+s[0]+'</div><div class="v">'+s[1]+'</div></div>'}).join('');
  var TD={};todo().forEach(function(t){TD[t[0]]=t[3]});
  $('tabs').innerHTML=Object.keys(TABS).map(function(k){return '<button data-t="'+k+'" class="'+(k===TAB?'on':'')+'">'+TABS[k]+(TD[k]?'<span class="n">'+TD[k]+'</span>':'')+'</button>'}).join('');
  $('tabs').querySelectorAll('button').forEach(function(b){b.onclick=function(){TAB=b.dataset.t;$('fs').dataset.t='';render()}});
  var opts={ctv:CTV.STATUS,samples:SAMPLE,videos:VID,orders:CTV.ORDER}[TAB];
  if($('fs').dataset.t!==TAB){$('fs').dataset.t=TAB;$('fs').innerHTML='<option value="">Tất cả trạng thái</option>'+(opts?Object.keys(opts).map(function(k){return '<option value="'+k+'">'+opts[k][0]+'</option>'}).join(''):'');$('fs').classList.toggle('hide',!opts)}
  var fs=$('fs').value;var keep=function(o){return hit(o)&&(!fs||o.status===fs)};
  ({ctv:tCtv,samples:tSamples,videos:tVideos,orders:tOrders,pay:tPay,contracts:tContracts})[TAB](keep);
}
function rev(a){return a.slice().reverse()}

function tCtv(keep){
  $('tb').innerHTML='<tr><th>Ngày ĐK</th><th>CTV</th><th>Loại / Kênh</th><th>Trạng thái</th><th>% HH riêng</th><th>Ghi chú</th><th>Thao tác</th></tr>'+
  rev(D.ctv).filter(keep).map(function(u){
    var a='';
    if(u.status==='pending')a+='<button class="btn ok sm" data-a="st" data-v="approved">Duyệt</button><button class="btn bad sm" data-a="st" data-v="rejected">Từ chối</button>';
    if(u.status==='rejected')a+='<button class="btn sm" data-a="st" data-v="approved">Duyệt lại</button>';
    a+=u.status==='locked'?'<button class="btn sm" data-a="st" data-v="active">Mở khóa</button>':'<button class="btn ghost sm" data-a="st" data-v="locked">Khóa</button>';
    a+='<button class="btn ghost sm" data-a="pw">Cấp lại MK</button><select data-a="force"><option value="">Đổi trạng thái…</option>'+Object.keys(CTV.STATUS).map(function(k){return '<option value="'+k+'">'+CTV.STATUS[k][0]+'</option>'}).join('')+'</select>';
    return '<tr data-id="'+E(u.id)+'"><td class="small">'+E(String(u.created_at).slice(0,10))+'</td><td>'+name(u.id)+(u.is_admin==='TRUE'?' <span class="pill">Admin</span>':'')+'</td>'+
      '<td class="small">'+E(u.kind)+'<br>'+linkify(u.channels)+'</td><td>'+CTV.pill(CTV.STATUS,u.status)+'</td>'+
      '<td><input data-a="rate" type="number" min="0" max="100" step="0.5" style="width:70px" value="'+E(u.commission_rate)+'" placeholder="Bậc" title="Để trống = hoa hồng theo bậc doanh thu tháng; nhập số = % cố định cho CTV này"></td>'+
      '<td><input data-a="note" style="width:160px" value="'+E(u.admin_note)+'" placeholder="Ghi chú cho CTV"></td><td>'+a+'</td></tr>'}).join('');
  bind(function(tr,el){var id=tr.dataset.id,a=el.dataset.a;
    if(a==='st'){var note=tr.querySelector('[data-a=note]').value;if(el.dataset.v==='rejected'&&!note){note=prompt('Lý do từ chối (CTV sẽ thấy):')||''}return act('adminSetCtv',{id:id,status:el.dataset.v,admin_note:note})}
    if(a==='pw'){var p=prompt('Mật khẩu mới cho CTV (tối thiểu 6 ký tự):');if(p)return act('adminSetCtv',{id:id,new_password:p},'Đã đổi mật khẩu. Gửi mật khẩu mới cho CTV qua Zalo.')}
  },function(tr,el){var id=tr.dataset.id,a=el.dataset.a;
    if(a==='rate')return act('adminSetCtv',{id:id,commission_rate:el.value},(el.value===''?'CTV này hưởng hoa hồng theo bậc doanh thu tháng':'Đã đặt % cố định cho CTV này')+' (tính lại đơn chưa trả của tháng này)');
    if(a==='note')return act('adminSetCtv',{id:id,admin_note:el.value},'Đã lưu ghi chú');
    if(a==='force'&&el.value&&confirm('Đổi trạng thái CTV này thành "'+CTV.STATUS[el.value][0]+'"?'))return act('adminSetCtv',{id:id,status:el.value});
  });
}
function tSamples(keep){
  $('tb').innerHTML='<tr><th>Ngày</th><th>CTV</th><th>Sản phẩm</th><th>Giá web → mẫu</th><th>Giao tới</th><th>Trạng thái</th></tr>'+
  rev(D.samples).filter(keep).map(function(s){return '<tr data-id="'+E(s.id)+'"><td class="small">'+E(s.created_at)+'<br>'+E(s.id)+'</td><td>'+name(s.ctv_id)+'</td>'+
    '<td>'+E(s.product_name)+(s.variant?'<br><span class="small">'+E(s.variant)+'</span>':'')+(s.note?'<br><span class="small muted">Ghi chú: '+E(s.note)+'</span>':'')+'</td>'+
    '<td><span class="old">'+CTV.money(s.web_price)+'</span><br><b>'+CTV.money(s.sample_price)+'</b></td><td class="small">'+E(s.receiver)+' – '+E(s.phone)+'<br>'+E(s.address)+'</td>'+
    '<td><select data-a="ss">'+Object.keys(SAMPLE).map(function(k){return '<option value="'+k+'"'+(k===s.status?' selected':'')+'>'+SAMPLE[k][0]+'</option>'}).join('')+'</select></td></tr>'}).join('');
  bind(null,function(tr,el){if(el.value==='delivered'&&!confirm('Xác nhận CTV đã nhận hàng mẫu? CTV sẽ được mở bước gửi video.'))return render();act('adminSampleStatus',{id:tr.dataset.id,status:el.value})});
}
function tVideos(keep){
  $('tb').innerHTML='<tr><th>Ngày</th><th>CTV</th><th>Video</th><th>Trạng thái</th><th>Thao tác</th></tr>'+
  rev(D.videos).filter(keep).map(function(v){return '<tr data-id="'+E(v.id)+'"><td class="small">'+E(v.created_at)+'</td><td>'+name(v.ctv_id)+'</td>'+
    '<td><a href="'+E(v.url)+'" target="_blank" rel="noopener nofollow">Xem video</a>'+(v.note?'<br><span class="small muted">'+E(v.note)+'</span>':'')+(v.admin_note?'<br><span class="small">Nhận xét: '+E(v.admin_note)+'</span>':'')+'</td>'+
    '<td>'+CTV.pill(VID,v.status)+'</td><td>'+(v.status==='pending'?'<button class="btn ok sm" data-a="ok">Duyệt – mở hoa hồng</button><button class="btn bad sm" data-a="no">Chưa đạt</button>':'')+'</td></tr>'}).join('');
  bind(function(tr,el){if(el.dataset.a==='ok'&&confirm('Duyệt video và mở hoa hồng cho CTV này?'))return act('adminReviewVideo',{id:tr.dataset.id,ok:true,note:''});
    if(el.dataset.a==='no'){var n=prompt('Lý do chưa đạt (CTV sẽ thấy và gửi lại):');if(n!==null)return act('adminReviewVideo',{id:tr.dataset.id,ok:false,note:n})}});
}
function tOrders(keep){
  $('tb').innerHTML='<tr><th>Ngày / Mã đơn</th><th>CTV</th><th>Khách</th><th>Sản phẩm</th><th>Giá trị</th><th>HH</th><th>Trạng thái</th><th>Đã trả HH</th></tr>'+
  rev(D.orders).filter(keep).map(function(o){return '<tr data-id="'+E(o.order_code)+'"><td class="small">'+E(o.created_at)+'<br><b>'+E(o.order_code)+'</b></td><td>'+name(o.ctv_id)+'</td>'+
    '<td class="small">'+E(o.customer_name)+'<br>'+E(o.customer_phone)+'</td><td class="small">'+E(o.items).replace(/\n/g,'<br>')+'</td>'+
    '<td><input data-a="total" type="number" style="width:110px" value="'+E(o.total)+'" title="Sửa giá trị thực thu"></td><td>'+CTV.money(o.commission)+'<br><span class="small muted">'+E(o.commission_rate)+'%</span></td>'+
    '<td><select data-a="os">'+Object.keys(CTV.ORDER).map(function(k){return '<option value="'+k+'"'+(k===o.status?' selected':'')+'>'+CTV.ORDER[k][0]+'</option>'}).join('')+'</select></td>'+
    '<td><input type="checkbox" data-a="paid" style="width:auto"'+(o.paid==='TRUE'?' checked':'')+(o.status!=='delivered'?' disabled':'')+'></td></tr>'}).join('');
  bind(null,function(tr,el){var c=tr.dataset.id,a=el.dataset.a;
    if(a==='os')return act('adminOrder',{order_code:c,status:el.value});
    if(a==='total')return act('adminOrder',{order_code:c,total:el.value},'Đã cập nhật giá trị và hoa hồng');
    if(a==='paid')return act('adminOrder',{order_code:c,paid:el.checked});});
}
function tPay(){
  var rows={};D.orders.forEach(function(o){if(o.status!=='delivered')return;var r=rows[o.ctv_id]=rows[o.ctv_id]||{n:0,due:0,paid:0};r.n++;if(o.paid==='TRUE')r.paid+=+o.commission;else r.due+=+o.commission});
  $('tb').innerHTML='<tr><th>CTV</th><th>Đơn đã giao</th><th>Hoa hồng chưa trả</th><th>Đã trả</th><th>Tài khoản nhận</th></tr>'+
  Object.keys(rows).filter(function(id){return hit({ctv_id:id})}).sort(function(a,b){return rows[b].due-rows[a].due}).map(function(id){var r=rows[id],u=byId(id);
    return '<tr><td>'+name(id)+'</td><td>'+r.n+'</td><td><b>'+CTV.money(r.due)+'</b></td><td>'+CTV.money(r.paid)+'</td><td class="small">'+E(u.bank_name)+'<br>'+E(u.bank_account)+'<br>'+E(u.bank_holder)+'</td></tr>'}).join('')+
  '<tr><td colspan="5" class="small muted">Sau khi chuyển khoản, vào tab "Đơn hàng" tích ô "Đã trả HH" cho từng đơn.</td></tr>';
}
function tContracts(){
  $('tb').innerHTML='<tr><th>Ngày ký</th><th>CTV</th><th>Bên B</th><th>Địa chỉ</th><th>File</th></tr>'+
  rev(D.contracts).filter(function(c){return hit(c)}).map(function(c){return '<tr><td class="small">'+E(c.signed_at)+'<br>'+E(c.version)+'</td><td>'+name(c.ctv_id)+'</td>'+
    '<td>'+E(c.full_name)+(c.dob?' · '+E(c.dob):'')+'<br><span class="small">CCCD '+E(c.id_number)+' · '+E(c.id_issued)+'<br>'+E(c.phone)+(c.email?' · '+E(c.email):'')+'</span></td><td class="small">'+E(c.address)+'</td><td><a href="'+E(c.pdf_url)+'" target="_blank" rel="noopener">Mở PDF</a></td></tr>'}).join('');
}
function linkify(s){return E(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener nofollow">$1</a>')}
function bind(onClick,onChange){$('tb').querySelectorAll('[data-a]').forEach(function(el){var tr=el.closest('tr');
  if(el.tagName==='BUTTON'&&onClick)el.onclick=function(){onClick(tr,el)};
  if(el.tagName!=='BUTTON'&&onChange)el.onchange=function(){onChange(tr,el)}})}
function act(action,data,okText){CTV.msg($('mAd'),'Đang lưu…',true);
  return CTV.call(action,data).then(function(){CTV.msg($('mAd'),okText||'Đã cập nhật',true);return load()}).catch(function(e){CTV.msg($('mAd'),e.message);render()})}
load();
</script>
</body>
